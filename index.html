<html lang="en" data-accent="maths">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samu: A Link to the Math</title>
<meta name="description" content="A revision arcade &mdash; one game per test.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>%F0%9F%8E%AE</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;900&display=swap">
<style>
/* ============================================================
   SAMUEL QUEST — ENGINE.CSS
   Shared pixel-gaming design system.
   DO NOT fork this file per subject. Subjects only override
   --accent / --accent-2 via the [data-accent] attribute.
   ============================================================ */



/* ---------- 1. TOKENS ---------- */
:root {
  /* Base world palette — identical in every subject */
  --bg-0:      #0b0f2a;   /* deepest background          */
  --bg-1:      #131a3f;   /* panel background            */
  --bg-2:      #1c2555;   /* raised surface              */
  --bg-3:      #2a3573;   /* hover surface               */
  --ink:       #eaf0ff;   /* primary text                */
  --ink-dim:   #97a3d4;   /* secondary text              */
  --line:      #4658b8;   /* pixel border                */

  /* Semantic — identical in every subject */
  --good:      #3ce88a;
  --good-dark: #12683f;
  --bad:       #ff4d6d;
  --bad-dark:  #7a1930;
  --warn:      #ffd93d;
  --xp:        #7ee8fa;

  /* Subject accent — the ONLY thing a subject may change */
  --accent:    #7ee8fa;
  --accent-2:  #c77dff;

  /* Pixel geometry */
  --px:        4px;       /* one "pixel" unit            */
  --radius:    0px;       /* never round corners         */
  --font-ui:   'Press Start 2P', 'Courier New', monospace;
  --font-read: 'Nunito', 'Segoe UI', system-ui, sans-serif;
}

/* Per-subject accents. Add a new line when a new subject is added. */
[data-accent="maths"]     { --accent:#7ee8fa; --accent-2:#c77dff; }
[data-accent="science"]   { --accent:#3ce88a; --accent-2:#ffd93d; }
[data-accent="english"]   { --accent:#ff9e64; --accent-2:#ff4d6d; }
[data-accent="humanities"]{ --accent:#ffd93d; --accent-2:#ff9e64; }
[data-accent="spanish"]   { --accent:#ff6ec7; --accent-2:#7ee8fa; }
[data-accent="computing"] { --accent:#a0ff5c; --accent-2:#7ee8fa; }

/* ---------- 2. RESET / SHELL ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  background: var(--bg-0);
  background-image:
    radial-gradient(circle at 20% 0%,  rgba(126,232,250,.10), transparent 45%),
    radial-gradient(circle at 85% 15%, rgba(199,125,255,.10), transparent 45%),
    linear-gradient(180deg, #0b0f2a 0%, #070a1c 100%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-read);
  font-size: 17px;
  line-height: 1.6;
  min-height: 100vh;
  padding: 0 0 64px;
  overflow-x: hidden;
}

/* CRT scanlines — decorative, never blocks clicks */
body::after {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 9999;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,.13) 0px,
    rgba(0,0,0,.13) 1px,
    transparent 1px,
    transparent 3px
  );
  mix-blend-mode: multiply;
  opacity: .55;
}

.wrap { max-width: 860px; margin: 0 auto; padding: 0 18px; }

/* ---------- 3. PIXEL PRIMITIVES ---------- */

/* Chunky stepped border. Used on every box in the game. */
.pixel-box {
  background: var(--bg-1);
  border: var(--px) solid var(--line);
  box-shadow:
     0 0 0 var(--px) var(--bg-0),
     0 var(--px) 0 var(--px) rgba(0,0,0,.55);
  position: relative;
}

.pixel-box--raised { background: var(--bg-2); }

h1, h2, h3, .ui, .btn, .tag, .hud, .tile {
  font-family: var(--font-ui);
  letter-spacing: .5px;
  line-height: 1.5;
}

h1 { font-size: 20px; }
h2 { font-size: 15px; }
h3 { font-size: 12px; }

.text-accent { color: var(--accent); }
.text-dim    { color: var(--ink-dim); }

/* ---------- 4. BUTTONS ---------- */
.btn {
  display: inline-block;
  font-size: 11px;
  padding: 14px 18px;
  background: var(--bg-2);
  color: var(--ink);
  border: var(--px) solid var(--line);
  box-shadow: 0 var(--px) 0 0 #0a0e24, inset 0 var(--px) 0 0 rgba(255,255,255,.08);
  cursor: pointer;
  text-decoration: none;
  text-align: center;
  transition: transform .06s steps(2), background .12s;
  user-select: none;
}
.btn:hover   { background: var(--bg-3); }
.btn:active  { transform: translateY(var(--px)); box-shadow: 0 0 0 0 #0a0e24; }
.btn:focus-visible { outline: var(--px) solid var(--warn); outline-offset: var(--px); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }

.btn--primary {
  background: var(--accent);
  color: #071024;
  border-color: #fff;
  font-weight: 700;
}
.btn--primary:hover { background: #fff; }

.btn--ghost { background: transparent; }

/* ---------- 5. HUD ---------- */
.hud {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  margin: 18px 0;
  font-size: 10px;
}
.hud__group { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.hud__stat  { display: flex; gap: 7px; align-items: center; color: var(--ink-dim); }
.hud__stat b { color: var(--ink); font-weight: 400; }

.bar {
  height: 16px;
  background: #0a0e24;
  border: var(--px) solid var(--line);
  overflow: hidden;
  flex: 1;
  min-width: 140px;
}
.bar__fill {
  height: 100%;
  width: 0%;
  background: repeating-linear-gradient(90deg,
     var(--accent) 0 8px, color-mix(in srgb, var(--accent) 70%, #000) 8px 12px);
  transition: width .35s steps(10);
}

/* ---------- 6. AVATAR ---------- */
.avatar {
  width: 64px; height: 64px;
  image-rendering: pixelated;
  flex: none;
  filter: drop-shadow(0 4px 0 rgba(0,0,0,.6));
}
.avatar--sm { width: 40px; height: 40px; }
.avatar--lg { width: 96px; height: 96px; }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
.avatar--bob { animation: bob 1.4s steps(4) infinite; }

/* Reacciones a la respuesta */
@keyframes cheer {
  0%   { transform: translateY(0)     scale(1); }
  20%  { transform: translateY(-16px) scale(1.1); }
  40%  { transform: translateY(0)     scale(1); }
  60%  { transform: translateY(-10px) scale(1.06); }
  80%  { transform: translateY(0)     scale(1); }
  100% { transform: translateY(-4px)  scale(1.02); }
}
.avatar--cheer { animation: cheer .8s steps(8) forwards; }

@keyframes slump {
  0%   { transform: translateY(0)   rotate(0deg); }
  25%  { transform: translateY(3px) rotate(-7deg); }
  55%  { transform: translateY(6px) rotate(5deg); }
  100% { transform: translateY(7px) rotate(0deg); filter: grayscale(.5) drop-shadow(0 2px 0 rgba(0,0,0,.6)); }
}
.avatar--down { animation: slump .55s steps(5) forwards; }

@media (prefers-reduced-motion: reduce) {
  .avatar--bob, .avatar--cheer, .avatar--down { animation: none; }
  .shake, .pop { animation: none; }
}

/* Compañero en la pantalla de juego */
.mate {
  display: flex; align-items: center; gap: 12px;
  flex: none;
  min-width: 190px;
}
.mate__sprite { width: 56px; height: 56px; display: grid; place-items: center; flex: none; }
.mate__sprite .avatar { width: 56px; height: 56px; }
.mate__msg {
  font-family: var(--font-ui);
  font-size: 11px;
  line-height: 1.7;
  color: var(--ink-dim);
}
.mate__msg.is-good { color: var(--good); }
.mate__msg.is-bad  { color: var(--bad); }

/* ---------- 7. LEVEL MAP ---------- */
.levels { display: grid; gap: 16px; margin-top: 22px; }

.level-card {
  display: grid;
  grid-template-columns: 64px 1fr auto;
  gap: 16px;
  align-items: center;
  padding: 16px;
  cursor: pointer;
  transition: transform .08s steps(2);
}
.level-card:hover:not(.is-locked) { transform: translate(0, -3px); }
.level-card.is-locked { opacity: .45; cursor: not-allowed; }
.level-card.is-done   { border-color: var(--good); }

.level-card__num {
  font-family: var(--font-ui);
  font-size: 22px;
  width: 64px; height: 64px;
  display: grid; place-items: center;
  background: var(--bg-0);
  border: var(--px) solid var(--accent);
  color: var(--accent);
}
.level-card.is-done .level-card__num { border-color: var(--good); color: var(--good); }
.level-card__name { font-family: var(--font-ui); font-size: 12px; margin-bottom: 8px; }
.level-card__sub  { color: var(--ink-dim); font-size: 14px; }
.stars { font-family: var(--font-ui); font-size: 16px; color: var(--warn); white-space: nowrap; }
.stars .off { color: #333c72; }

/* ---------- 8. QUESTION SCREEN ---------- */
.stage { margin-top: 20px; padding: 22px; }

.q-tag {
  display: inline-block;
  font-family: var(--font-ui);
  font-size: 9px;
  padding: 6px 9px;
  background: var(--bg-0);
  border: 2px solid var(--accent);
  color: var(--accent);
  margin-bottom: 16px;
}

.q-stem { font-size: 19px; font-weight: 700; line-height: 1.55; margin-bottom: 8px; }
.q-sub  { color: var(--ink-dim); font-size: 15px; margin-bottom: 18px; }

/* Sequence tiles */
.seq {
  display: flex; flex-wrap: wrap; gap: 10px;
  margin: 18px 0 22px;
  overflow-x: auto;          /* fracciones largas nunca empujan la página */
  padding-bottom: 4px;
}
.tile {
  min-width: 62px;
  padding: 12px 10px;
  text-align: center;
  font-size: 13px;
  background: var(--bg-0);
  border: var(--px) solid var(--line);
  color: var(--ink);
}
.tile--blank { border-color: var(--warn); color: var(--warn); background: #1a1533; }
.tile--ghost { opacity: .45; }

/* Options */
.options { display: grid; gap: 12px; grid-template-columns: repeat(2, 1fr); }
@media (max-width: 620px) { .options { grid-template-columns: 1fr; } }

.opt {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 14px;
  background: var(--bg-2);
  border: var(--px) solid var(--line);
  box-shadow: 0 var(--px) 0 0 #0a0e24;
  cursor: pointer;
  font-size: 18px;
  font-weight: 700;
  text-align: left;
  color: var(--ink);
  font-family: var(--font-read);
  transition: background .12s, transform .06s steps(2);
}
.opt:hover:not(:disabled) { background: var(--bg-3); }
.opt:active:not(:disabled){ transform: translateY(var(--px)); box-shadow: none; }
.opt:focus-visible { outline: var(--px) solid var(--warn); outline-offset: var(--px); }
.opt__key {
  font-family: var(--font-ui);
  font-size: 11px;
  width: 30px; height: 30px;
  flex: none;
  display: grid; place-items: center;
  background: var(--bg-0);
  border: 2px solid var(--line);
  color: var(--accent);
}
.opt.is-right { background: var(--good-dark); border-color: var(--good); }
.opt.is-right .opt__key { border-color: var(--good); color: var(--good); }
.opt.is-wrong { background: var(--bad-dark); border-color: var(--bad); }
.opt.is-wrong .opt__key { border-color: var(--bad); color: var(--bad); }
.opt:disabled { cursor: default; }

@keyframes shake {
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)}
  40%{transform:translateX(7px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
}
.shake { animation: shake .3s steps(3); }

@keyframes pop { 0%{transform:scale(.9)} 60%{transform:scale(1.04)} 100%{transform:scale(1)} }
.pop { animation: pop .22s steps(3); }

/* Feedback panel */
.feedback { margin-top: 18px; padding: 16px; display: none; }
.feedback.is-on { display: block; }
.feedback__title { font-family: var(--font-ui); font-size: 12px; margin-bottom: 10px; }
.feedback--good { border-color: var(--good); }
.feedback--good .feedback__title { color: var(--good); }
.feedback--bad  { border-color: var(--bad); }
.feedback--bad  .feedback__title { color: var(--bad); }
.feedback__body { font-size: 16px; }
.feedback__body code {
  font-family: var(--font-ui); font-size: 12px;
  background: var(--bg-0); padding: 2px 5px; border: 2px solid var(--line);
}

/* Hint */
.hint {
  margin-top: 14px; padding: 12px 14px;
  border-left: var(--px) solid var(--warn);
  background: rgba(255,217,61,.08);
  font-size: 15px;
  display: none;
}
.hint.is-on { display: block; }

/* Briefing (mini-lesson) */
.brief { padding: 22px; margin-top: 20px; }
.brief h2 { color: var(--accent); margin-bottom: 16px; }
.brief p  { margin-bottom: 14px; font-size: 17px; }
.brief ul { margin: 0 0 14px 20px; }
.brief li { margin-bottom: 8px; }
.brief .example {
  background: var(--bg-0);
  border: var(--px) solid var(--line);
  padding: 14px; margin: 14px 0;
  font-family: var(--font-ui); font-size: 12px; line-height: 1.9;
  overflow-x: auto;
}

/* Combo popup */
.combo {
  position: fixed; right: 20px; top: 20px; z-index: 50;
  font-family: var(--font-ui); font-size: 14px;
  color: var(--warn); text-shadow: 0 3px 0 #000;
  opacity: 0; pointer-events: none;
}
@keyframes floatUp { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-40px)} }
.combo.is-on { animation: floatUp .8s steps(8) forwards; }

/* Victory screen */
.victory { text-align: center; padding: 34px 22px; }
.victory h2 { color: var(--warn); font-size: 18px; margin-bottom: 18px; }
.victory .stars { font-size: 34px; margin: 18px 0; }
.victory__stats { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; margin: 22px 0; font-family: var(--font-ui); font-size: 11px; }
.victory__stats div span { display: block; color: var(--ink-dim); font-size: 9px; margin-bottom: 8px; }

/* Row helpers */
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.row--end { justify-content: flex-end; }
.mt   { margin-top: 18px; }
.mt-lg{ margin-top: 30px; }

.screen { display: none; }
.screen.is-on { display: block; }

/* Site header */
.site-head { padding: 26px 0 6px; display: flex; gap: 18px; align-items: center; }
.site-head h1 { line-height: 1.4; }
.site-head p { color: var(--ink-dim); font-size: 14px; margin-top: 8px; }

footer { text-align: center; color: var(--ink-dim); font-size: 12px; margin-top: 40px; }

@media (max-width: 620px) {
  body { font-size: 16px; }
  h1 { font-size: 15px; }
  .stage { padding: 16px; }
  .level-card { grid-template-columns: 52px 1fr; }
  .level-card__num { width: 52px; height: 52px; font-size: 18px; }
  .stars { grid-column: 1 / -1; }
  .mate { min-width: 0; width: 100%; }
  .hud { justify-content: flex-start; }
  .hud__group { width: 100%; }
  .btn { padding: 14px 14px; }          /* objetivo táctil >= 44px de alto */
}

@media (max-width: 380px) {
  .mate__sprite, .mate__sprite .avatar { width: 44px; height: 44px; }
  .mate__msg { font-size: 10px; }
  .tile { min-width: 52px; padding: 10px 8px; font-size: 12px; }
  .q-stem { font-size: 17px; }
}

</style>
</head>

<script>
/* ============================================================
   SAMU: A LINK TO THE MATH — UI.JS
   Capa de CHROME compartido.

   Aqui vive TODO el texto de interfaz que es identico para
   cualquier materia: botones, HUD, titulos de pantalla, mensajes
   genericos del companero. `engine.js` no contiene ni un solo
   texto visible; lo lee de aqui.

   Tres capas (PLAN-V2.md §0.2):
     data.js  -> contenido de la materia (mundos, jefes, preguntas)
     ui.js    -> chrome compartido            <- ESTE ARCHIVO
     engine.js-> logica, cero texto visible

   Cualquier materia puede sobreescribir cualquier clave de aqui
   declarando `DATA.ui = { ... }` en su data.js. La mezcla es
   profunda: solo se pisa lo que se declara.

   Placeholders: {n}, {total}, {xp}... se sustituyen con UI.fmt().
   Se editan a mano, casi nunca. Un nombre de jefe NO va aqui:
   va en data.js. (Regla grep del proyecto.)
   ============================================================ */
window.GAME_UI = {

  /* ---------- MARCA ----------
     `brand` lo lee tambien tools/build.py para el <title> y el hub.
     Si se renombra, cambiarlo AQUI y en ningun otro sitio.
     La clave de localStorage NO depende de esto y no se renombra. */
  brand:   'Samu: A Link to the Math',
  tagline: 'Year 6 &middot; Counting, sequences and rules',

  /* ---------- HUB (index.html) ---------- */
  hub: {
    subtitle:   'Year 6 &middot; Pick a game and start playing.',
    statGames:  'GAMES',
    statNote:   'Play at your own pace',

      'Progress is saved in this browser. Replay any level to hunt for 3 stars.'

    cardMeta:   '{test} &middot; {levels} levels &middot; {done}/{levels} cleared'

  /* ---------- ERRORES ---------- */
  err: {

  },

  /* ---------- MAPA ---------- */
  map: {
    statXP:      'XP',
    statLevels:  'LEVELS',
    btnMusicOn:  'MUSIC: ON',
    btnMusicOff: 'MUSIC: OFF',
    btnSoundOn:  'SOUND: ON',
    btnSoundOff: 'SOUND: OFF',
    btnReset:    'RESET',
    intro:       'Clear a level to unlock the next one. Play as many as you want, whenever you want.',
    cardMeta:    'LEVEL {n} &middot; {count} challenges',
    cardBest:    ' &middot; best {xp} XP',
    lockIcon:    '&#128274;',
    allDone:     '&#127942; ALL LEVELS CLEARED',
    allDoneBody: 'You are ready for the {test}. Replay any level to push for 3 stars.',
    confirmReset:'Reset all progress for {topic}?'
  },

  /* ---------- BRIEFING ---------- */
  brief: {
    tag:   'LEVEL {n} &middot; BRIEFING',
    back:  '&lt; MAP',
    start: 'START LEVEL &gt;'
  },

  /* ---------- PARTIDA ---------- */
  play: {
    levelTag:    'LV {n}',
    statXP:      'XP',
    statCombo:   'COMBO',
    optionsLabel:'Answer options',
    btnHint:     'HINT',
    btnMusic:    'MUSIC: {state}',
    stateOn:     'ON',
    stateOff:    'OFF',
    btnQuit:     'QUIT',
    btnNext:     'NEXT &gt;',
    btnFinish:   'FINISH LEVEL &gt;',
    hintLabel:   '<b>Hint:</b> ',
    hintRetry:   '<b>You saw this one before &mdash; here is the method:</b> ',
    hintFallback:'Look at the size of each jump.',
    goodTitle:   '&#10003; CORRECT',
    badTitle:    '&#10007; NOT YET',
    badNote:     '<b>This challenge comes back later with different numbers</b> &mdash; so work out the method, not the answer.',
    confirmQuit: 'Leave this level? Progress in this level is not saved.'
  },

  /* ---------- COMPANERO DE PANTALLA ----------
     Genericos: nunca nombran a nadie. Una materia puede sustituirlos
     desde data.js con `meta.mate` o `ui.mate`. */

    start:   'LET\'S GO',
    turn:    'YOUR TURN',
    retry:   'ROUND TWO',
    combo:   'COMBO x{n}',
    comboPop:'COMBO x{n}!',
    cheers:   ['NICE ONE!', 'GOT IT!', 'YES!', 'SHARP!', 'CLEAN WORK!', 'THAT\'S IT!'],
    consoles: ['NOT YET...', 'ALMOST!', 'TRY AGAIN', 'KEEP GOING', 'SHAKE IT OFF']
  },

  /* ---------- VICTORIA ---------- */
  win: {
    title:      'LEVEL {n} CLEARED',
    statXP:     'XP',
    statFirst:  'FIRST TRY',
    statCombo:  'BEST COMBO',
    statMisses: 'MISSES',
    verdict3:   'Perfect run. You have this topic locked in.',
    verdict2:   'Strong. Replay to hunt the third star.',
    verdict1:   'Cleared it. Play it again &mdash; the questions come back with new numbers.',
    unlocked:   '&#128275; UNLOCKED: LEVEL {n} &mdash; {name}',
    btnReplay:  'REPLAY',
    btnMap:     'BACK TO MAP &gt;'
  }
};

</script>

      <path fill="var(--accent)" d="M3 5h1v3H3z M13 5h1v3h-1z M3 4h11v1H3z"/>
      <path fill="var(--accent-2)" d="M5 12h7v6H5z M3 13h2v4H3z M12 13h2v4h-2z"/>
      <path fill="#fff" d="M8 14h1v3H8z M7 15h3v1H7z"/>
      <path fill="#1c2555" d="M5 18h3v2H5z M9 18h3v2H9z"/>
    </svg>
    <div>
      <h1 id="hubBrand"></h1>
      <p id="hubSub"></p>
    </div>
  </header>

  <div class="pixel-box hud">
    <div class="hud__group"><span class="hud__stat"><span id="hubStatGames"></span> <b id="cnt">0</b></span></div>
    <div class="hud__group"><span class="hud__stat text-dim" id="hubNote"></span></div>
  </div>

  <div class="levels" id="list"></div>

  <div class="pixel-box brief mt-lg">
    <h2 id="hubHowTitle"></h2>
    <ul id="hubHow"></ul>
  </div>

  <footer id="hubFoot"></footer>
</div>

<script>
var SUBJECTS = [
  {
    "slug": "y6-maths-counting-sequences",
    "subject": "Maths",
    "topic": "Counting and Sequences",
    "test": "Cycle Test #1",
    "accent": "maths",
    "added": "2026-09-05",
    "blurb": "Counting on and back with whole numbers, decimals, fractions and negatives, plus position-to-term rules.",
    "levels": 5
  }
];
(function () {
  var UI = (window.GAME_UI || {});
  var H  = UI.hub || {};
  function fmt(tpl, vals) {
    return String(tpl == null ? '' : tpl).replace(/\{(\w+)\}/g, function (m, k) {
      return (vals && vals[k] != null) ? String(vals[k]) : m;
    });
  }
  function set(id, html) { var n = document.getElementById(id); if (n) n.innerHTML = html == null ? '' : html; }

  set('hubBrand',     UI.brand);
  set('hubSub',       H.subtitle);
  set('hubStatGames', H.statGames);
  set('hubNote',      H.statNote);
  set('hubHowTitle',  H.howTitle);
  set('hubFoot',      UI.brand);
  document.getElementById('hubHow').innerHTML =
    (H.how || []).map(function (t) { return '<li>' + t + '</li>'; }).join('');

  var list = document.getElementById('list');
  document.getElementById('cnt').textContent = SUBJECTS.length;

  if (!SUBJECTS.length) {
    list.innerHTML = '<div class="pixel-box stage"><p>' + (H.empty || '') + '</p></div>';
    return;
  }

  SUBJECTS.forEach(function (s) {
    var done = 0, stars = 0;
    try {
      // La clave de guardado no cambia aunque el juego cambie de nombre.
      var raw = localStorage.getItem('samuel-quest:' + s.slug);
      if (raw) {
        var st = JSON.parse(raw);
        Object.keys(st.levels || {}).forEach(function (k) {
          if (st.levels[k].done) done++;
          stars += st.levels[k].stars || 0;
        });
      }
    } catch (e) { /* storage blocked */ }

    var a = document.createElement('a');
    a.className = 'pixel-box level-card';
    a.href = s.slug + '.html';
    a.style.textDecoration = 'none';
    a.style.color = 'inherit';
    a.setAttribute('data-accent', s.accent || 'maths');
    if (done >= s.levels) a.classList.add('is-done');
    a.innerHTML =
      '<div class="level-card__num" style="font-size:11px">' + s.subject.slice(0, 4).toUpperCase() + '</div>' +
      '<div>' +
        '<div class="level-card__name">' + s.topic + '</div>' +
        '<div class="level-card__sub">' + s.blurb + '</div>' +
        '<div class="level-card__sub text-dim" style="margin-top:6px;font-size:13px">' +
          fmt(H.cardMeta, { test: s.test, levels: s.levels, done: done }) + '</div>' +
      '</div>' +
      '<div class="stars">' + stars + '&#9733;</div>';
    list.appendChild(a);
  });
})();
</script>
</body>
</html>
