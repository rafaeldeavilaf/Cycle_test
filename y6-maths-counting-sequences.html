<!DOCTYPE html>
<html lang="en" data-accent="maths">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samu: A Link to the Math — Counting and Sequences</title>
<meta name="description" content="Counting on and back with whole numbers, decimals, fractions and negatives, working out the step yourself, and position-to-term rules both ways.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>%F0%9F%8E%AE</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;900&display=swap">
<style>
/* ============================================================
   SAMUEL QUEST — ENGINE.CSS
   Shared pixel-gaming design system.
   DO NOT fork this file per subject. Subjects only override
   --accent / --accent-2 via the [data-accent] attribute.
   ============================================================ */



/* ---------- 1. TOKENS ---------- */
:root {
  /* Base world palette — identical in every subject */
  --bg-0:      #0b0f2a;   /* deepest background          */
  --bg-1:      #131a3f;   /* panel background            */
  --bg-2:      #1c2555;   /* raised surface              */
  --bg-3:      #2a3573;   /* hover surface               */
  --ink:       #eaf0ff;   /* primary text                */
  --ink-dim:   #97a3d4;   /* secondary text              */
  --line:      #4658b8;   /* pixel border                */

  /* Semantic — identical in every subject */
  --good:      #3ce88a;
  --good-dark: #12683f;
  --bad:       #ff4d6d;
  --bad-dark:  #7a1930;
  --warn:      #ffd93d;
  --xp:        #7ee8fa;

  /* Subject accent — the ONLY thing a subject may change */
  --accent:    #7ee8fa;
  --accent-2:  #c77dff;

  /* Pixel geometry */
  --px:        4px;       /* one "pixel" unit            */
  --radius:    0px;       /* never round corners         */
  --font-ui:   'Press Start 2P', 'Courier New', monospace;
  --font-read: 'Nunito', 'Segoe UI', system-ui, sans-serif;
}

/* Per-subject accents. Add a new line when a new subject is added. */
[data-accent="maths"]     { --accent:#7ee8fa; --accent-2:#c77dff; }
[data-accent="science"]   { --accent:#3ce88a; --accent-2:#ffd93d; }
[data-accent="english"]   { --accent:#ff9e64; --accent-2:#ff4d6d; }
[data-accent="humanities"]{ --accent:#ffd93d; --accent-2:#ff9e64; }
[data-accent="spanish"]   { --accent:#ff6ec7; --accent-2:#7ee8fa; }
[data-accent="computing"] { --accent:#a0ff5c; --accent-2:#7ee8fa; }

/* ---------- 2. RESET / SHELL ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  background: var(--bg-0);
  background-image:
    radial-gradient(circle at 20% 0%,  rgba(126,232,250,.10), transparent 45%),
    radial-gradient(circle at 85% 15%, rgba(199,125,255,.10), transparent 45%),
    linear-gradient(180deg, #0b0f2a 0%, #070a1c 100%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-read);
  font-size: 17px;
  line-height: 1.6;
  min-height: 100vh;
  padding: 0 0 64px;
  overflow-x: hidden;
}

/* CRT scanlines — decorative, never blocks clicks */
body::after {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 9999;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,.13) 0px,
    rgba(0,0,0,.13) 1px,
    transparent 1px,
    transparent 3px
  );
  mix-blend-mode: multiply;
  opacity: .55;
}

.wrap { max-width: 860px; margin: 0 auto; padding: 0 18px; }

/* ---------- 3. PIXEL PRIMITIVES ---------- */

/* Chunky stepped border. Used on every box in the game. */
.pixel-box {
  background: var(--bg-1);
  border: var(--px) solid var(--line);
  box-shadow:
     0 0 0 var(--px) var(--bg-0),
     0 var(--px) 0 var(--px) rgba(0,0,0,.55);
  position: relative;
}

.pixel-box--raised { background: var(--bg-2); }

h1, h2, h3, .ui, .btn, .tag, .hud, .tile {
  font-family: var(--font-ui);
  letter-spacing: .5px;
  line-height: 1.5;
}

h1 { font-size: 20px; }
h2 { font-size: 15px; }
h3 { font-size: 12px; }

.text-accent { color: var(--accent); }
.text-dim    { color: var(--ink-dim); }

/* ---------- 4. BUTTONS ---------- */
.btn {
  display: inline-block;
  font-size: 11px;
  padding: 14px 18px;
  background: var(--bg-2);
  color: var(--ink);
  border: var(--px) solid var(--line);
  box-shadow: 0 var(--px) 0 0 #0a0e24, inset 0 var(--px) 0 0 rgba(255,255,255,.08);
  cursor: pointer;
  text-decoration: none;
  text-align: center;
  transition: transform .06s steps(2), background .12s;
  user-select: none;
}
.btn:hover   { background: var(--bg-3); }
.btn:active  { transform: translateY(var(--px)); box-shadow: 0 0 0 0 #0a0e24; }
.btn:focus-visible { outline: var(--px) solid var(--warn); outline-offset: var(--px); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }

.btn--primary {
  background: var(--accent);
  color: #071024;
  border-color: #fff;
  font-weight: 700;
}
.btn--primary:hover { background: #fff; }

.btn--ghost { background: transparent; }

/* ---------- 5. HUD ---------- */
.hud {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  margin: 18px 0;
  font-size: 10px;
}
.hud__group { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.hud__stat  { display: flex; gap: 7px; align-items: center; color: var(--ink-dim); }
.hud__stat b { color: var(--ink); font-weight: 400; }

.bar {
  height: 16px;
  background: #0a0e24;
  border: var(--px) solid var(--line);
  overflow: hidden;
  flex: 1;
  min-width: 140px;
}
.bar__fill {
  height: 100%;
  width: 0%;
  background: repeating-linear-gradient(90deg,
     var(--accent) 0 8px, color-mix(in srgb, var(--accent) 70%, #000) 8px 12px);
  transition: width .35s steps(10);
}

/* ---------- 6. AVATAR ---------- */
/* Contorno oscuro alrededor de TODO el sprite. Es lo que hacen los juegos de
   8 bits para que el personaje se lea sobre cualquier fondo: sin el, el pelo
   castano contra un cielo oscuro daba 1.03:1 y la cabeza desaparecia.
   Cuatro drop-shadow de 2px = una linea de contorno; el quinto es la sombra
   en el suelo que ya existia. */
.avatar {
  width: 64px; height: 64px;
  image-rendering: pixelated;
  flex: none;
  filter:
    drop-shadow( 2px 0 0 #120c18) drop-shadow(-2px 0 0 #120c18)
    drop-shadow(0  2px 0 #120c18) drop-shadow(0 -2px 0 #120c18)
    drop-shadow(0  4px 0 rgba(0,0,0,.45));
}
.avatar--sm { width: 40px; height: 40px; }
.avatar--lg { width: 96px; height: 96px; }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
.avatar--bob { animation: bob 1.4s steps(4) infinite; }

/* Reacciones a la respuesta */
/* Playtest H3: el brinco con escalado se leia "de kinder" a los 10-11.
   Ahora es un gesto contenido: brazos arriba (ya en el sprite) y un pequeno
   rebote, sin escalar. */
@keyframes cheer {
  0%   { transform: translateY(0); }
  30%  { transform: translateY(-6px); }
  60%  { transform: translateY(0); }
  100% { transform: translateY(-2px); }
}
.avatar--cheer { animation: cheer .5s steps(5) forwards; }

/* Sin `filter` en el ultimo fotograma: sobreescribia el contorno del sprite y
   la cabeza volvia a perderse justo al fallar, que es cuando mas se mira. */
@keyframes slump {
  0%   { transform: translateY(0)   rotate(0deg); }
  25%  { transform: translateY(3px) rotate(-7deg); }
  55%  { transform: translateY(6px) rotate(5deg); }
  100% { transform: translateY(7px) rotate(0deg); }
}
.avatar--down { animation: slump .55s steps(5) forwards; }

/* ----- Invocar la calculadora magica (PLAN-V2 §6.2) -----
   1.1 s en cuatro fases, todo con steps() y sin `ease`:
   alzar (0-0.3) · destello (0.3-0.5) · aparicion (0.5-0.9) · sostener. */
/* Solo brillo: el `filter` del sprite (su contorno) no se toca aqui. */
@keyframes summonGlow {
  0%, 25%, 100% { opacity: 1; }
  40%           { opacity: .75; }
}
.avatar--summon { animation: summonGlow 1.1s steps(6) forwards; }

@keyframes flashPop { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
.avatar .flash {
  opacity: 0;
  transform-origin: 13px 4px;
  animation: flashPop .2s steps(3) .3s forwards;
}

@keyframes calcIn { 0% { transform: translateY(6px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
.avatar .calc {
  opacity: 0;
  animation: calcIn .4s steps(4) .5s forwards;
}

@media (prefers-reduced-motion: reduce) {
  .avatar--bob, .avatar--cheer, .avatar--down { animation: none; }
  .shake, .pop { animation: none; }
  /* Se salta a la fase 4: la calculadora ya esta ahi, sin destello. */
  .avatar--summon { animation: none; }
  .avatar .flash  { display: none; }
  .avatar .calc   { opacity: 1; animation: none; }
}

/* Mensaje del companero. El sprite vive en la escena, no aqui: un solo
   personaje en movimiento se sigue mejor que tres repartidos. */
.mate {
  display: flex; align-items: center; gap: 12px;
  flex: none;
  min-width: 150px;
}
.mate__msg {
  font-family: var(--font-ui);
  font-size: 11px;
  line-height: 1.7;
  color: var(--ink-dim);
}
.mate__msg.is-good { color: var(--good); }
.mate__msg.is-bad  { color: var(--bad); }

/* ---------- 6b. HEROE Y ARMERIA (v2) ---------- */
.hero-pick { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 18px; }

.hero-card {
  flex: 1 1 160px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: 18px 14px;
  background: var(--bg-0);
  border: var(--px) solid var(--line);
  cursor: pointer;
  color: var(--ink-dim);
  font-family: var(--font-ui);
  font-size: 10px;
}
.hero-card:hover { background: var(--bg-2); }
.hero-card:focus-visible { outline: var(--px) solid var(--warn); outline-offset: var(--px); }
.hero-card.is-on { border-color: var(--accent); background: var(--bg-2); color: var(--accent); }
.hero-card__art .avatar { width: 84px; height: 84px; }

.field {
  flex: 1 1 200px;
  min-width: 0;
  padding: 13px 12px;
  background: var(--bg-0);
  border: var(--px) solid var(--line);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.field:focus-visible { outline: var(--px) solid var(--warn); outline-offset: var(--px); }

.armoury {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 24px;
  align-items: start;
  margin-top: 20px;
}
.arm-row { display: grid; gap: 8px; margin-bottom: 16px; }
.arm-row__label { font-family: var(--font-ui); font-size: 9px; color: var(--ink-dim); }
.arm-row__strip { display: flex; gap: 8px; flex-wrap: wrap; }
/* La piel trae 12 tonos: muestras algo mas pequenas para que la rampa se lea
   entera de un vistazo, de mas claro a mas oscuro. */
.arm-row__strip--skin .swatch { width: 32px; height: 32px; }
@media (max-width: 620px) { .arm-row__strip--skin .swatch { width: 28px; height: 28px; } }

.swatch {
  width: 38px; height: 38px;
  flex: none;
  border: var(--px) solid var(--line);
  cursor: pointer;
  padding: 0;
}
.swatch:hover { border-color: var(--ink-dim); }
.swatch:focus-visible { outline: var(--px) solid var(--warn); outline-offset: 2px; }
.swatch.is-on { border-color: #fff; box-shadow: 0 0 0 var(--px) var(--bg-0) inset; }
/* Bloqueado: se ve que existe, no se ve el color. Se gana dominando un nivel. */
.swatch.is-locked { background: var(--bg-0) !important; cursor: not-allowed; opacity: .8; display: grid; place-items: center; }
.swatch__lock { font-size: 14px; line-height: 1; }
.swatch--inline { display: inline-block; width: 16px; height: 16px; vertical-align: middle; border-width: 2px; }

.armoury__preview {
  display: grid; justify-items: center; gap: 10px;
  padding: 18px;
  background: var(--bg-0);
  border: var(--px) solid var(--line);
}
.armoury__tag { font-family: var(--font-ui); font-size: 9px; color: var(--ink-dim); }

@media (max-width: 620px) {
  .armoury { grid-template-columns: 1fr; }
  .armoury__preview { justify-self: stretch; }
  .swatch { width: 34px; height: 34px; }
}

/* ---------- 7. LEVEL MAP ---------- */
.levels { display: grid; gap: 16px; margin-top: 22px; }

.level-card {
  display: grid;
  grid-template-columns: 64px 1fr auto;
  gap: 16px;
  align-items: center;
  padding: 16px;
  cursor: pointer;
  transition: transform .08s steps(2);
}
.level-card:hover:not(.is-locked) { transform: translate(0, -3px); }
.level-card.is-locked { opacity: .45; cursor: not-allowed; }
.level-card.is-done   { border-color: var(--good); }

.level-card__num {
  font-family: var(--font-ui);
  font-size: 22px;
  width: 64px; height: 64px;
  display: grid; place-items: center;
  background: var(--bg-0);
  border: var(--px) solid var(--accent);
  color: var(--accent);
}
.level-card.is-done .level-card__num { border-color: var(--good); color: var(--good); }
.level-card__name { font-family: var(--font-ui); font-size: 12px; margin-bottom: 8px; }
.level-card__sub  { color: var(--ink-dim); font-size: 14px; }
.stars { font-family: var(--font-ui); font-size: 16px; color: var(--warn); white-space: nowrap; }
.stars .off { color: #333c72; }

/* ---------- 7b. PROGRESO, MEDALLAS Y PERFIL (v2) ----------
   Todo lo de aqui mide al nino contra si mismo. No hay nada comparativo con
   otros ninos: eso exigiria un servidor con datos de menores. */
.progress { margin: 18px 0 4px; }
.progress__head {
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  font-family: var(--font-ui); font-size: 9px;
  color: var(--ink-dim);
  margin-bottom: 8px;
}

.medal-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

.medal {
  display: inline-block;
  padding: 8px 10px;
  font-family: var(--font-ui);
  font-size: 9px;
  line-height: 1.6;
  background: var(--bg-0);
  border: 2px solid var(--line);
  color: var(--ink-dim);
}
.medal--1 { border-color: #b87333; color: #e0a06a; }   /* bronce */
.medal--2 { border-color: #b9c4d6; color: #dce6f5; }   /* plata  */
.medal--3 { border-color: var(--warn); color: var(--warn); }
.medal--0 { opacity: .55; }

.medals-new {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  align-items: center;
  margin: 18px 0;
}
.medals-new__tag {
  font-family: var(--font-ui); font-size: 9px; color: var(--warn);
  width: 100%;
}

.score-lines { margin: 16px 0; font-size: 15px; display: grid; gap: 6px; }
.score-best { color: var(--warn); font-weight: 700; }
.score-up   { color: var(--good); font-weight: 700; }
.score-down { color: var(--ink-dim); }

.prof-lv { margin: 20px 0 10px; color: var(--accent); }
.prof-scroll { overflow-x: auto; }
.prof-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-ui);
  font-size: 9px;
  line-height: 1.8;
}
.prof-table th, .prof-table td {
  border: 2px solid var(--line);
  padding: 8px 10px;
  text-align: left;
  white-space: nowrap;
}
.prof-table th { color: var(--ink-dim); background: var(--bg-0); }
.prof-table td { color: var(--ink); }

/* ---------- 8. QUESTION SCREEN ---------- */
.stage { margin-top: 20px; padding: 22px; }

.q-tag {
  display: inline-block;
  font-family: var(--font-ui);
  font-size: 9px;
  padding: 6px 9px;
  background: var(--bg-0);
  border: 2px solid var(--accent);
  color: var(--accent);
  margin-bottom: 16px;
}

.q-stem { font-size: 19px; font-weight: 700; line-height: 1.55; margin-bottom: 8px; }
.q-sub  { color: var(--ink-dim); font-size: 15px; margin-bottom: 18px; }

/* Sequence tiles */
.seq {
  display: flex; flex-wrap: wrap; gap: 10px;
  margin: 18px 0 22px;
  overflow-x: auto;          /* fracciones largas nunca empujan la página */
  padding-bottom: 4px;
}
.tile {
  min-width: 62px;
  padding: 12px 10px;
  text-align: center;
  font-size: 13px;
  background: var(--bg-0);
  border: var(--px) solid var(--line);
  color: var(--ink);
}
.tile--blank { border-color: var(--warn); color: var(--warn); background: #1a1533; }
.tile--ghost { opacity: .45; }

/* ---------- 8b. SCENES — moverse ES responder (v2) ----------
   Cada casilla es un <button> real: foco, Tab y aria salen gratis.
   El heroe es un sprite absoluto que se desplaza con `left`; con
   prefers-reduced-motion la transicion se anula y APARECE en la casilla
   en vez de caminar. Un nino con solo teclado juega el mismo juego.
   Sin canvas: un heroe y <= 12 casillas no lo justifican.
------------------------------------------------------------- */
.scene-host { margin: 4px 0 2px; }

.scene__corridor {
  position: relative;
  padding: 16px 14px 0;
  border: var(--px) solid var(--line);
  background: linear-gradient(180deg, #070a1c 0%, #10163a 100%);
  overflow: hidden;
}

/* `stretch`, no `flex-end`: una opcion puede ser un numero corto ("24") o una
   secuencia entera ("70, 62, 54, 46"). Las puertas crecen con su contenido y
   todas igualan a la mas alta, para que el corredor siga leyendose como tal.
   Altura fija = texto cortado. */
.scene__row { display: flex; gap: 8px; align-items: stretch; }

/* Casilla de inicio del tramo: a donde vuelve el heroe al fallar. */
.scene__start {
  flex: 0 0 52px;
  min-height: 96px;
  display: grid; place-items: center;
  border: var(--px) dashed var(--line);
  border-bottom: none;
  color: var(--ink-dim);
}
.scene__start-tag { font-family: var(--font-ui); font-size: 8px; letter-spacing: 1px; }
.scene__start.is-here { border-color: var(--accent); color: var(--accent); }

/* Puertas */
.door {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 0;
  background: none;
  border: 0;
  cursor: pointer;
  color: var(--ink);
  font-family: var(--font-read);
}
.door__key {
  font-family: var(--font-ui);
  font-size: 10px;
  width: 26px; height: 26px;
  display: grid; place-items: center;
  background: var(--bg-0);
  border: 2px solid var(--line);
  color: var(--accent);
}
.door__frame {
  position: relative;
  width: 100%;
  flex: 1 1 auto;               /* crece con el texto; nunca lo corta */
  min-height: 92px;
  display: grid; place-items: center;
  padding: 12px 10px 20px;      /* hueco abajo para el pomo */
  background: var(--bg-2);
  border: var(--px) solid var(--line);
  border-bottom: none;
  transition: background .12s;
}
.door__frame::after {                 /* pomo, abajo a la derecha:
                                         centrado chocaba con el texto largo */
  content: '';
  position: absolute; right: 8px; bottom: 8px;
  width: 6px; height: 6px;
  background: var(--warn);
}
.door__value {
  font-size: 17px; font-weight: 700; line-height: 1.35;
  text-align: center; overflow-wrap: anywhere;
}
.door:hover:not(:disabled) .door__frame { background: var(--bg-3); }
.door:focus-visible { outline: none; }
.door:focus-visible .door__frame { outline: var(--px) solid var(--warn); outline-offset: 2px; }
.door:disabled { cursor: default; }

.door.is-here .door__frame { background: var(--bg-3); border-color: var(--accent); }
.door.is-here .door__key   { border-color: var(--accent); }
.door.is-right .door__frame { background: var(--good-dark); border-color: var(--good); }
.door.is-right .door__key   { border-color: var(--good); color: var(--good); }
.door.is-wrong .door__frame { background: var(--bad-dark); border-color: var(--bad); }
.door.is-wrong .door__key   { border-color: var(--bad); color: var(--bad); }

/* Suelo del corredor y heroe */
.scene__floor {
  height: 78px;
  border-top: var(--px) solid var(--line);
  background: repeating-linear-gradient(90deg, #141a3f 0 14px, #0f1433 14px 28px);
}
.scene__hero {
  position: absolute;
  left: 0; bottom: 10px;
  transform: translateX(-50%);
  transition: left .22s steps(6);
  pointer-events: none;
}
.scene__hero .avatar { width: 52px; height: 52px; }

/* ----- Corredor VERTICAL: opciones largas (secuencias, frases) -----
   Cuatro frases en columnas de 80px son ilegibles. Aqui cada puerta es una
   banda a lo ancho y el heroe baja por el carril izquierdo. El modelo de
   movimiento no cambia: las flechas mueven una casilla y Enter cruza. */
.scene--stacked .scene__corridor { padding-bottom: 16px; }
.scene--stacked .scene__row { flex-direction: column; align-items: stretch; gap: 8px; }

.scene--stacked .scene__start {
  align-self: flex-start;
  flex: none;
  width: 52px;
  min-height: 42px;
  border: var(--px) dashed var(--line);
}
.scene--stacked .scene__start-tag { writing-mode: horizontal-tb; }

.scene--stacked .door {
  flex-direction: row;
  align-items: stretch;
  gap: 10px;
  margin-left: 64px;             /* deja el carril del heroe a la izquierda */
}
.scene--stacked .door__key { align-self: center; }
.scene--stacked .door__frame {
  min-height: 52px;
  border-bottom: var(--px) solid var(--line);
  padding: 12px 22px 12px 12px;
  place-items: center start;
}
.scene--stacked .door__value { text-align: left; font-size: 16px; }
.scene--stacked .door__frame::after { top: 50%; bottom: auto; margin-top: -3px; }

.scene--stacked .scene__floor { display: none; }
.scene--stacked .scene__corridor::before {   /* el carril por donde baja */
  content: '';
  position: absolute;
  left: 40px; top: 14px; bottom: 14px;
  width: var(--px);
  background: repeating-linear-gradient(180deg, var(--line) 0 8px, transparent 8px 16px);
}
.scene--stacked .scene__hero {
  bottom: auto;
  transform: translate(-50%, -50%);
  transition: top .22s steps(6);
}

@media (max-width: 700px) {
  .scene--stacked .door { margin-left: 44px; }
  .scene--stacked .scene__corridor::before { left: 26px; }
  .scene--stacked .scene__start { width: 38px; }
  .scene--stacked .scene__start-tag { font-size: 7px; }
  .scene--stacked .door__value { font-size: 14px; }
}

@media (prefers-reduced-motion: reduce) {
  .scene--stacked .scene__hero { transition: none; }
}

.scene__help {
  margin-top: 12px;
  font-size: 13px;
  color: var(--ink-dim);
}
/* `nowrap`: "A B C D" partido en dos lineas se lee como dos cosas distintas. */
.scene__help b {
  color: var(--accent);
  font-family: var(--font-ui);
  font-size: 10px;
  white-space: nowrap;
}
/* Las flechas necesitan una fuente que tenga el glifo. */
.scene__help kbd {
  color: var(--accent);
  font-family: var(--font-read);
  font-weight: 900;
  font-size: 16px;
  white-space: nowrap;
}

@media (max-width: 700px) {
  .scene__corridor { padding: 12px 10px 0; }
  .scene__row { gap: 6px; }
  .scene__start { flex-basis: 30px; min-height: 78px; }
  .scene__start-tag { writing-mode: vertical-rl; font-size: 7px; }
  .door__key { width: 22px; height: 22px; font-size: 8px; }
  .door__frame { min-height: 78px; padding: 8px 6px 18px; }
  .door__value { font-size: 14px; line-height: 1.3; }
  .scene__floor { height: 64px; }
  .scene__hero .avatar { width: 44px; height: 44px; }
  .scene__help { font-size: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  /* El heroe aparece en la casilla en vez de caminar hasta ella. */
  .scene__hero { transition: none; }
  .door__frame { transition: none; }
}

/* ---------- 8c. LUGARES (ENV) y CAMINO DE TRAMOS ----------
   Cinco capas detras de la escena: cielo, lejano, pared, suelo, primer plano.
   Props en SVG inline (assets/props.js) y materiales como patron SVG tintado.
   Todo decorativo va aria-hidden y sin pointer-events: la escena esta encima.
   Regla R1 del panel: nada decorativo junto a las casillas. ------------------ */
/* Alturas del lugar: cielo (donde asoman torres y la puerta del jefe),
   franja alta de pared (almenas, antorchas, ventanas: SIN puertas debajo),
   luego las casillas, y el suelo. Visto en vivo: sin la franja de cielo la
   pared lo tapaba todo y los props caian detras de las puertas. */
.world { position: relative; --env-floor-h: 78px; --env-sky-h: 64px; --env-strip-h: 34px; }
.world .scene-host { position: relative; z-index: 1; }
.world.is-stacked { --env-floor-h: 18px; }

/* Con lugar, el corredor de la escena se vuelve transparente, deja sitio
   arriba para cielo y pared, y las casillas se visten del material. */
.has-env .scene__corridor { background: transparent; border-color: transparent;
                            padding-top: calc(var(--env-sky-h) + var(--env-strip-h) + 12px); }
.has-env .scene__floor    { background: transparent; border-top-color: transparent; }
.has-env .door__frame  { background: var(--env-slot); border-color: var(--env-slotline); }
.has-env .door__key    { border-color: var(--env-slotline); color: var(--env-glow); }
.has-env .scene__start { border-color: var(--env-slotline); color: var(--env-slotline); }
.has-env .door.is-here .door__frame { border-color: var(--env-glow); }
.has-env .scene--stacked .scene__corridor::before { background: repeating-linear-gradient(180deg, var(--env-slotline) 0 8px, transparent 8px 16px); }

.env { position: absolute; inset: 0; overflow: hidden; z-index: 0; border: var(--px) solid var(--env-line); }
.env__layer { position: absolute; left: 0; right: 0; }
.env__props { position: absolute; inset: 0; }
.env__sky   { top: 0; bottom: 0; background: linear-gradient(180deg, var(--env-sky), var(--env-sky2)); }
/* Lo lejano se apoya en la linea alta del muro (bottom:0 de esta capa). */
.env__far   { top: 0; height: var(--env-sky-h); }
.env__far .env__props { overflow: visible; }
.env__wall  { top: var(--env-sky-h); bottom: var(--env-floor-h); background-blend-mode: multiply; background-repeat: repeat;
              background-position: calc(var(--hx, 0) * -48px) 0; transition: background-position .22s steps(6); }
.env__floor { bottom: 0; height: var(--env-floor-h); background-blend-mode: multiply; background-repeat: repeat;
              border-top: var(--px) solid var(--env-line);
              background-position: calc(var(--hx, 0) * -72px) 0; transition: background-position .22s steps(6); }
.env__fg    { bottom: 0; height: var(--env-floor-h); }

/* Parallax: una variable. Lo lejano se mueve menos que lo cercano. */
.env__far  .env__props { transform: translateX(calc(var(--hx, 0) * -3%)); transition: transform .22s steps(6); }
.env__wall .env__props { transform: translateX(calc(var(--hx, 0) * -6%)); transition: transform .22s steps(6); }

.prop { position: absolute; transform: translateX(-50%); image-rendering: pixelated; }
.env__gate { transform: translateX(-50%) scale(var(--gs, .45)); transform-origin: bottom center; transition: transform .35s steps(5); }

/* Llamas / luces: dos cuadros alternos con steps. En aula quedan quietas. */
.prop .f1 { animation: flick 1s steps(1, end) infinite; }
.prop .f2 { opacity: 0; animation: flick 1s steps(1, end) infinite reverse; }
@keyframes flick { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

/* Deslizamiento de tramo al pulsar NEXT: el lugar LLEGA desde la derecha y
   se asienta. Un solo disparo por clase; sin temporizadores. */
.env.is-shift .env__far  .env__props { animation: envArriveFar .24s steps(6); }
.env.is-shift .env__wall .env__props { animation: envArrive .24s steps(6); }
.env.is-shift .env__wall, .env.is-shift .env__floor { animation: envArriveBg .24s steps(6); }
@keyframes envArriveFar { from { transform: translateX(3%); } to { transform: translateX(calc(var(--hx, 0) * -3%)); } }
@keyframes envArrive    { from { transform: translateX(8%); } to { transform: translateX(calc(var(--hx, 0) * -6%)); } }
@keyframes envArriveBg  { from { background-position: 64px 0; } to { background-position: 0 0; } }

/* La escena anterior sale por la izquierda; la nueva entra por la derecha.
   Nada bloquea: el heroe nuevo responde desde el primer frame. */
.scene-slot { position: relative; }
.scene-slot.is-in  { animation: sceneIn .24s steps(6); }
.scene-slot.is-out { position: absolute; inset: 0; z-index: 0; pointer-events: none; animation: sceneOut .24s steps(6) forwards; }
@keyframes sceneIn  { from { transform: translateX(28%); opacity: .3; } to { transform: none; opacity: 1; } }
@keyframes sceneOut { from { transform: none; opacity: 1; } to { transform: translateX(-28%); opacity: 0; } }

/* El camino del HUD: un tramo por familia. */
.bar.path { display: flex; gap: 3px; padding: 2px; height: 16px; }
.bar.path i { flex: 1; background: var(--bg-2); }
.bar.path i.on  { background: var(--good); }
.bar.path i.now { background: var(--warn); }

@media (max-width: 700px) { .world { --env-floor-h: 64px; --env-sky-h: 44px; --env-strip-h: 22px; } }

/* Modo aula y reduced-motion: el lugar se queda quieto, la transicion es un
   corte seco, las llamas no titilan. El lugar sigue ahi; solo no se mueve. */
@media (prefers-reduced-motion: reduce) {
  .env, .env *, .scene-slot { animation: none !important; transition: none !important; }
}
.is-aula .env, .is-aula .env *, .is-aula .scene-slot { animation: none !important; transition: none !important; }

/* Solo para lectores de pantalla: anuncia la posicion del heroe. */
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

@keyframes shake {
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)}
  40%{transform:translateX(7px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
}
.shake { animation: shake .3s steps(3); }

@keyframes pop { 0%{transform:scale(.9)} 60%{transform:scale(1.04)} 100%{transform:scale(1)} }
.pop { animation: pop .22s steps(3); }

/* Feedback panel */
.feedback { margin-top: 18px; padding: 16px; display: none; }
.feedback.is-on { display: block; }
.feedback__title { font-family: var(--font-ui); font-size: 12px; margin-bottom: 10px; }
.feedback--good { border-color: var(--good); }
.feedback--good .feedback__title { color: var(--good); }
.feedback--bad  { border-color: var(--bad); }
.feedback--bad  .feedback__title { color: var(--bad); }
.feedback__body { font-size: 16px; }
.feedback__body code {
  font-family: var(--font-ui); font-size: 12px;
  background: var(--bg-0); padding: 2px 5px; border: 2px solid var(--line);
}

/* Hint */
.hint {
  margin-top: 14px; padding: 12px 14px;
  border-left: var(--px) solid var(--warn);
  background: rgba(255,217,61,.08);
  font-size: 15px;
  display: none;
}
.hint.is-on { display: block; }

/* Briefing (mini-lesson) */
.brief { padding: 22px; margin-top: 20px; }
.brief h2 { color: var(--accent); margin-bottom: 16px; }
.brief p  { margin-bottom: 14px; font-size: 17px; }
.brief ul { margin: 0 0 14px 20px; }
.brief li { margin-bottom: 8px; }
.brief .example {
  background: var(--bg-0);
  border: var(--px) solid var(--line);
  padding: 14px; margin: 14px 0;
  font-family: var(--font-ui); font-size: 12px; line-height: 1.9;
  overflow-x: auto;
}

/* Combo popup */
.combo {
  position: fixed; right: 20px; top: 20px; z-index: 50;
  font-family: var(--font-ui); font-size: 14px;
  color: var(--warn); text-shadow: 0 3px 0 #000;
  opacity: 0; pointer-events: none;
}
@keyframes floatUp { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-40px)} }
.combo.is-on { animation: floatUp .8s steps(8) forwards; }

/* Victory screen */
.victory { text-align: center; padding: 34px 22px; }
.victory h2 { color: var(--warn); font-size: 18px; margin-bottom: 18px; }
.victory .stars { font-size: 34px; margin: 18px 0; }
.victory__stats { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; margin: 22px 0; font-family: var(--font-ui); font-size: 11px; }
.victory__stats div span { display: block; color: var(--ink-dim); font-size: 9px; margin-bottom: 8px; }

/* Row helpers */
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.row--end { justify-content: flex-end; }
.mt   { margin-top: 18px; }
.mt-lg{ margin-top: 30px; }

.screen { display: none; }
.screen.is-on { display: block; }

/* Site header */
.site-head { padding: 26px 0 6px; display: flex; gap: 18px; align-items: center; }
.site-head h1 { line-height: 1.4; }
.site-head p { color: var(--ink-dim); font-size: 14px; margin-top: 8px; }

footer { text-align: center; color: var(--ink-dim); font-size: 12px; margin-top: 40px; }

@media (max-width: 620px) {
  body { font-size: 16px; }
  h1 { font-size: 15px; }
  .stage { padding: 16px; }
  .level-card { grid-template-columns: 52px 1fr; }
  .level-card__num { width: 52px; height: 52px; font-size: 18px; }
  .stars { grid-column: 1 / -1; }
  .mate { min-width: 0; width: 100%; }
  .hud { justify-content: flex-start; }
  .hud__group { width: 100%; }
  .btn { padding: 14px 14px; }          /* objetivo táctil >= 44px de alto */
}

@media (max-width: 380px) {
  .mate__sprite, .mate__sprite .avatar { width: 44px; height: 44px; }
  .mate__msg { font-size: 10px; }
  .tile { min-width: 52px; padding: 10px 8px; font-size: 12px; }
  .q-stem { font-size: 17px; }
}

/* ============================================================

<script>
/* ============================================================
   SAMU: A LINK TO THE MATH — ENGINE.JS
   Subject-agnostic game engine. Reads window.QUIZ_DATA.

   REGLA DEL PROYECTO: este archivo NO contiene texto visible.
   Todo lo que el jugador lee vive en `assets/ui.js` (chrome) o en
   `subjects/<slug>/data.js` (contenido). Si un `grep` de un nombre
   de jefe, de mundo o de boton devuelve una linea de este archivo,
   esta mal.

   Never edit this file to add a subject; only add a data file.
   ============================================================ */
(function () {
  'use strict';

  var DATA = window.QUIZ_DATA;

  /* ---------- UI: chrome compartido + override por materia ----------
     Prioridad: ui.js  <  DATA.ui  <  DATA.meta.mate (solo companero).
     Mezcla profunda: una materia puede pisar una sola clave sin
     copiar el resto. */
  function deepMerge(base, over) {
    if (!over || typeof over !== 'object') return base;
    var out = {}, k;
    for (k in base) if (Object.prototype.hasOwnProperty.call(base, k)) out[k] = base[k];
    for (k in over) {
      if (!Object.prototype.hasOwnProperty.call(over, k)) continue;
      var b = base[k], o = over[k];
      if (o && typeof o === 'object' && !(o instanceof Array) &&
          b && typeof b === 'object' && !(b instanceof Array)) {
        out[k] = deepMerge(b, o);
      } else {
        out[k] = o;
      }
    }
    return out;
  }

  var UI = deepMerge(window.GAME_UI || {}, (DATA && DATA.ui) || {});
  if (DATA && DATA.meta && DATA.meta.mate) UI.mate = deepMerge(UI.mate || {}, DATA.meta.mate);

  /* Sustituye {clave} por el valor. Los valores se pasan YA escapados
     cuando vienen de datos; las plantillas de ui.js pueden llevar HTML. */
  function fmt(tpl, vals) {
    if (tpl == null) return '';
    return String(tpl).replace(/\{(\w+)\}/g, function (m, k) {
      return (vals && vals[k] != null) ? String(vals[k]) : m;
    });
  }

  if (!DATA) {
    document.body.innerHTML = '<p style="padding:40px">' + ((UI.err && UI.err.noData) || '') + '</p>';
    return;
  }

  /* La clave de guardado NO cambia aunque el juego cambie de nombre.
     Renombrarla borraria el progreso de quien ya venia jugando. */
  var SAVE_KEY = 'samuel-quest:' + DATA.meta.slug;
  var SAVE_VERSION = 3;
  var KEYS = ['A', 'B', 'C', 'D', 'E'];

  /* ---------- SAVE STATE ----------
     Migracion v2 -> v3: solo ANADE campos con valores por defecto.
     Nunca borra niveles, estrellas ni XP. */
  function blankLevel() {
    return { done: false, stars: 0, best: 0, plays: 0, bossClean: false, history: [] };
  }
  function normalizeLevel(ls) {
    if (!ls || typeof ls !== 'object') return blankLevel();
    ls.done      = !!ls.done;
    if (typeof ls.stars !== 'number' || ls.stars < 0) ls.stars = 0;
    if (typeof ls.best  !== 'number' || ls.best  < 0) ls.best  = 0;
    if (typeof ls.plays !== 'number' || ls.plays < 0) ls.plays = 0;
    if (typeof ls.bossClean !== 'boolean') ls.bossClean = false;
    if (!(ls.history instanceof Array)) ls.history = [];
    return ls;
  }
  function blankSave() {
    return {
      version: SAVE_VERSION,
      levels: {}, totalXP: 0, sound: true, music: true, aula: false,
      skills: {}, bestComboEver: 0
    };
  }
  function migrate(s) {
    if (typeof s.totalXP !== 'number' || s.totalXP < 0) s.totalXP = 0;
    if (typeof s.music !== 'boolean') s.music = true;
    if (typeof s.sound !== 'boolean') s.sound = true;
    if (typeof s.aula !== 'boolean') s.aula = false;   // modo aula: sin decoracion ni animacion
    if (!s.skills || typeof s.skills !== 'object' || s.skills instanceof Array) s.skills = {};
    if (typeof s.bestComboEver !== 'number' || s.bestComboEver < 0) s.bestComboEver = 0;
    Object.keys(s.levels).forEach(function (id) { s.levels[id] = normalizeLevel(s.levels[id]); });
    s.version = SAVE_VERSION;
    return s;
  }
  function load() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return blankSave();
      var s = JSON.parse(raw);
      if (!s || typeof s !== 'object' || !s.levels || typeof s.levels !== 'object') return blankSave();
      return migrate(s);
    } catch (e) { return blankSave(); }
  }
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(STATE)); } catch (e) { /* private mode */ }
  }
  var STATE = load();

  /* ---------- HEROE (transversal a materias) ----------
     Clave NUEVA y separada del progreso: si viviera dentro de
     `samuel-quest:<slug>` el nino tendria que reconfigurar su personaje en
     cada materia. Ninguna clave existente se renombra ni se toca.

     El personaje NO tiene nombre. Decision de Rafael: un nombre (el real o un
     alias) es la via mas facil de atribuirle genero, y el heroe es un avatar
     neutro que el nino viste, no un personaje con identidad propia. Por eso
     aqui no se guarda ningun texto libre: solo silueta y colores. */
  var HERO_KEY = 'samuel-quest:hero';

  function blankHero() {
    return {
      v: 1,
      body: 'a',

            muestra marcada, porque el valor guardado no coincidia con ningun

            color al pasar de Mates a Ciencias contradice justo eso.

         conserva exacto. Las botas pasan de #1c2555 (1.16:1, invisible sobre

      // La piel no es un color de armadura: no se bloquea nunca y vive aparte.

      colors: {

        body:  '#c77dff',   // PURPLE — era var(--accent-2)

      if (s.colors && typeof s.colors === 'object') {
        ['helm', 'body', 'glove', 'boot'].forEach(function (k) {
          if (typeof s.colors[k] === 'string' && s.colors[k]) h.colors[k] = s.colors[k];
        });
      }
    } catch (e) { /* private mode */ }
    return h;
  }
  function saveHero() {
    try { localStorage.setItem(HERO_KEY, JSON.stringify(HERO)); } catch (e) { /* private mode */ }
  }
  var HERO = loadHero();

  /* El tono de piel elegido, con sus rasgos. Si el guardado trae un valor que
     ya no esta en la paleta, se cae al primero en vez de dejar la cara rota. */
  function skinTone() {
    var list = (UI.armoury && UI.armoury.skins) || [];
    for (var i = 0; i < list.length; i++) if (list[i].value === HERO.skin) return list[i];
    return list[0] || { value: HERO.skin, eye: '#fae8d6', ink: '#2d1f16', mouth: '#5e4534' };
  }

  /* Pinta armadura y piel sobre cualquier contenedor de sprites. */
  function paintHero(node) {
    if (!node || !node.style) return;
    var t = skinTone();
    node.style.setProperty('--h-helm',  HERO.colors.helm);
    node.style.setProperty('--h-body',  HERO.colors.body);
    node.style.setProperty('--h-glove', HERO.colors.glove);
    node.style.setProperty('--h-boot',  HERO.colors.boot);
    node.style.setProperty('--h-skin',  t.value);
    node.style.setProperty('--h-eye',   t.eye);
    node.style.setProperty('--h-ink',   t.ink);
    node.style.setProperty('--h-mouth', t.mouth);
  }
  function paintAllHeroes() {
    paintHero(document.documentElement);
  }

  /* El contenido va en segunda persona y no lleva nombres. Si un data.js viejo
     trae el token {hero}, se sustituye por "you" para que nunca quede un hueco;
     el harness ademas falla si el token existe en el contenido publicado. */
  function heroText(s) {
    if (s == null) return '';
    return String(s).replace(/\{hero\}/g, UI.hero.you);
  }

  /* ---------- AUDIO (no assets, pure WebAudio) ---------- */
  var actx = null;
  function beep(freq, dur, type, vol) {
    if (!STATE.sound) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, actx.currentTime);
      g.gain.setValueAtTime(vol == null ? 0.06 : vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) { /* audio unavailable */ }
  }
  var SFX = {
    right:  function () { beep(660, .08); setTimeout(function () { beep(990, .12); }, 80); },
    wrong:  function () { beep(200, .18, 'sawtooth', .05); },
    click:  function () { beep(440, .04, 'square', .03); },
    level:  function () { [523, 659, 784, 1047].forEach(function (f, i) { setTimeout(function () { beep(f, .16); }, i * 110); }); },
    unlock: function () { [392, 523, 659].forEach(function (f, i) { setTimeout(function () { beep(f, .12); }, i * 90); }); },
    // Invocar la calculadora: arpegio ascendente de 3 notas + "ding".
    summon: function () {
      [523, 659, 784].forEach(function (f, i) { setTimeout(function () { beep(f, .10); }, i * 90); });
      setTimeout(function () { beep(1319, .22, 'triangle', .05); }, 300);
    }
  };

  /* ---------- MUSICA CHIPTUNE ----------
     Secuenciador de 8 compases generado con osciladores. Cero archivos,
     cero peso, cero licencias. Lead cuadrada + bajo triangular + bateria.
     Progresion I-V-vi-IV en Do mayor, 126 BPM.
  --------------------------------------- */
  var MUSIC = (function () {
    var mctx = null, bus = null, noise = null;
    var timer = null, step = 0, nextT = 0, on = false;
    var BPM = 126, EIGHTH = 30 / BPM;   // segundos por corchea

    // 0 = silencio. Notas MIDI.
    var LEAD_A = [
      64,67,72,67, 64,67,72,74,      // C
      74,71,67,71, 74,71,67,69,      // G
      72,69,64,69, 72,69,64,65,      // Am
      69,65,60,65, 69,72,67, 0       // F
    ];
    var LEAD_B = [
      72,76,79,76, 72,76,79,81,      // C (octava alta)
      79,74,71,74, 79,74,71,72,      // G
      76,72,69,72, 76,81,79,76,      // Am
      72,69,65,69, 72,76,72, 0       // F
    ];

    var BASS  = [48,0,55,0, 48,0,55,0,  43,0,50,0, 43,0,50,0,
                 45,0,52,0, 45,0,52,0,  41,0,48,0, 41,0,48,0];
    var KICK  = [1,0,0,0, 1,0,0,0];      // por compas
    var HAT   = [0,1,0,1, 0,1,0,1];

    function f(m) { return 440 * Math.pow(2, (m - 69) / 12); }

    function noiseBuf() {
      if (noise) return noise;
      var len = Math.floor(mctx.sampleRate * 0.2);
      noise = mctx.createBuffer(1, len, mctx.sampleRate);
      var d = noise.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      return noise;
    }

    function tone(freq, t, dur, type, vol) {
      var o = mctx.createOscillator(), g = mctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t + dur + 0.02);
    }

    function kick(t) {
      var o = mctx.createOscillator(), g = mctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(130, t);
      o.frequency.exponentialRampToValueAtTime(45, t + 0.11);
      g.gain.setValueAtTime(0.16, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t + 0.18);
    }

    function hat(t) {
      var s = mctx.createBufferSource(), g = mctx.createGain(), hp = mctx.createBiquadFilter();
      s.buffer = noiseBuf();
      hp.type = 'highpass'; hp.frequency.value = 7000;
      g.gain.setValueAtTime(0.035, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
      s.connect(hp); hp.connect(g); g.connect(bus);
      s.start(t); s.stop(t + 0.05);
    }

    function playStep(i, t) {
      var n = i % 32;                       // 32 corcheas = 4 compases
      var loop = Math.floor(i / 32) % 2;    // alterna frase A / B
      var lead = (loop === 0 ? LEAD_A : LEAD_B)[n];
      if (lead) tone(f(lead), t, EIGHTH * 0.85, 'square', 0.045);
      if (BASS[n]) tone(f(BASS[n]), t, EIGHTH * 1.6, 'triangle', 0.075);
      var b = n % 8;
      if (KICK[b]) kick(t);
      if (HAT[b])  hat(t);
    }

    function scheduler() {
      if (!on || !mctx) return;
      while (nextT < mctx.currentTime + 0.2) {
        playStep(step, nextT);
        nextT += EIGHTH;
        step++;
      }
    }

    var LEVEL = 0.5;
    function setGain(v, tau) {
      if (bus && mctx) bus.gain.setTargetAtTime(v, mctx.currentTime, tau || 0.06);
    }

    var api = {
      start: function () {
        if (on) return;
        try {
          if (!mctx) {
            mctx = new (window.AudioContext || window.webkitAudioContext)();
            bus = mctx.createGain();
            bus.gain.value = LEVEL;
            bus.connect(mctx.destination);
          }
          if (mctx.state === 'suspended') mctx.resume();
          on = true;
          setGain(LEVEL);
          nextT = mctx.currentTime + 0.08;
          scheduler();
          timer = setInterval(scheduler, 45);
        } catch (e) { on = false; }
      },
      stop: function () {
        on = false;
        if (timer) { clearInterval(timer); timer = null; }
        setGain(0, 0.04);
      },
      // Baja el volumen un momento para que se oiga un efecto de sonido.
      duck: function (ms) {
        if (!on) return;
        setGain(0.12, 0.04);
        setTimeout(function () { if (on) setGain(LEVEL, 0.08); }, ms || 1500);
      },
      isOn: function () { return on; }
    };
    return api;
  })();

  /* ---------- UTIL ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function el(id) { return document.getElementById(id); }
  function onOff(flag) { return flag ? UI.play.stateOn : UI.play.stateOff; }

  function levelSave(id) {
    if (!STATE.levels[id]) STATE.levels[id] = blankLevel();
    else STATE.levels[id] = normalizeLevel(STATE.levels[id]);
    return STATE.levels[id];
  }
  function isUnlocked(idx) {
    if (idx === 0) return true;
    var prev = DATA.levels[idx - 1];
    return !!levelSave(prev.id).done;
  }

  /* ---------- MEDALLAS POR HABILIDAD ----------
     0 nada · 1 bronce · 2 plata · 3 oro.

     Antiinflacion (PLAN-V2 §4.3): plata y oro exigen aciertos al primer
     intento EN PARTIDAS DISTINTAS, no dentro de la misma. Por eso `firstHits`
     se incrementa como mucho una vez por partida, al terminar el nivel, y no
     en cada respuesta. Sin esta regla todo seria oro en dos semanas. */
  var MEDAL_SILVER = 3, MEDAL_GOLD = 5;

  function skillRec(tag) {
    var r = STATE.skills[tag];
    if (!r || typeof r !== 'object') { r = STATE.skills[tag] = { hits: 0, firstHits: 0 }; }
    if (typeof r.hits !== 'number' || r.hits < 0) r.hits = 0;
    if (typeof r.firstHits !== 'number' || r.firstHits < 0) r.firstHits = 0;
    return r;
  }
  function medalOf(tag) {
    var r = STATE.skills[tag];
    if (!r) return 0;
    if (r.firstHits >= MEDAL_GOLD) return 3;
    if (r.firstHits >= MEDAL_SILVER) return 2;
    if (r.hits >= 1) return 1;
    return 0;
  }
  function medalName(m) {
    return m === 3 ? UI.score.medalGold
         : m === 2 ? UI.score.medalSilver
         : m === 1 ? UI.score.medalBronze
         : UI.score.medalNone;
  }
  /* Todas las habilidades del juego, en el orden en que aparecen. */
  function allSkills() {
    var seen = {}, out = [];
    DATA.levels.forEach(function (lv) {
      lv.questions.forEach(function (f) {
        if (!seen[f.skill]) { seen[f.skill] = true; out.push(f.skill); }
      });
    });
    return out;
  }
  function skillLabel(tag) { return String(tag).toUpperCase().replace(/-/g, ' '); }

  /* Progreso total: familias cuya habilidad ya tiene medalla (>= bronce). */
  function progressTotals() {
    var done = 0, total = 0;
    DATA.levels.forEach(function (lv) {
      lv.questions.forEach(function (f) {
        total++;
        if (medalOf(f.skill) >= 1) done++;
      });
    });
    return { done: done, total: total, pct: total ? Math.round(done / total * 100) : 0 };
  }

  /* ---------- SPRITE (inline pixel-art hero) ----------
     Ensamblado POR PARTES, no un string por mood. Con 3 moods x 2 cuerpos,
     escribir el SVG entero cada vez son 6 strings casi identicos que se
     desincronizan en cuanto se toca uno. (Deuda declarada en PLAN-V2 §6.)

     Moods: 'idle' | 'happy' | 'sad' | 'summon'
     Cuerpos: 'a' | 'b'  — difieren en pelo, silueta del torso y botas.
     La logica NO sabe de genero: son 'a' y 'b'; las etiquetas visibles
     viven en ui.js.

     Las 4 piezas de armadura se pintan con variables CSS
     (--h-helm / --h-body / --h-glove / --h-boot) que pone el contenedor.
     Asi un solo string sirve para todas las combinaciones y las animaciones
     CSS no cambian.
  -------------------------------------------------------- */
  /* Las dos siluetas tienen que distinguirse A SIMPLE VISTA y en miniatura.
     En la primera version se diferenciaban en 5 pixeles de pelo lateral y en
     pantalla parecian el mismo personaje: elegir dejaba de ser una eleccion.
     Ahora 'a' lleva el pelo corto al ras y 'b' una melena que baja hasta los
     hombros, con una segunda capa mas ancha. */
  var BODIES = {
    a: {
      hair:  'M4 1h9v2H4z M4 2h9v2H4z M3 2h1v3H3z M13 2h1v3h-1z',
      hairdark: 'M4 1h9v1H4z M3 2h1v1H3z M13 2h1v1h-1z',
      torso: 'M5 12h7v6H5z',
      shade: 'M10 12h2v6h-2z',
      boots: 'M5 18h3v2H5z M9 18h3v2H9z'
    },
    b: {
      hair:  'M4 1h9v2H4z M4 2h9v2H4z' +                 // corona
             ' M3 2h1v11H3z M13 2h1v11h-1z' +            // melena hasta el hombro
             ' M2 4h1v9H2z M14 4h1v9h-1z',               // segunda capa, mas ancha
      hairdark: 'M4 1h9v1H4z M2 4h1v1H2z M14 4h1v1h-1z M3 12h1v1H3z M13 12h1v1h-1z',
      torso: 'M5 12h7v3H5z M6 15h5v3H6z',
      shade: 'M10 12h2v3h-2z M9 15h2v3H9z',
      boots: 'M6 18h2v2H6z M9 18h2v2H9z'
    }
  };

  /* Brazos y manos van separados: en v1 los brazos llevaban el color del
     torso y no habia guantes que pintar. */
  /* Las manos ocupan 2 pixeles de alto, no 1: con uno solo, pintar los guantes
     en la armeria no se notaba y la pieza parecia rota. */
  var LIMBS = {
    idle:   { arms: 'M3 13h2v2H3z M12 13h2v2h-2z', hands: 'M3 15h2v2H3z M12 15h2v2h-2z' },
    happy:  { arms: 'M3 10h2v3H3z M12 10h2v3h-2z', hands: 'M3 8h2v2H3z M12 8h2v2h-2z'   },
    sad:    { arms: 'M3 14h2v2H3z M12 14h2v2h-2z', hands: 'M3 16h2v2H3z M12 16h2v2h-2z' },
    // summon: brazo derecho vertical, el izquierdo en reposo (PLAN-V2 §6.2).
    summon: { arms: 'M3 13h2v2H3z M12 8h2v5h-2z',  hands: 'M3 15h2v2H3z M12 6h2v2h-2z'  }
  };

  var FACES = {
    idle:   { eyes: 'M6 6h1v2H6z M10 6h1v2h-1z', mouth: 'M7 10h3v1H7z' },
    happy:  { eyes: 'M5 7h1v1H5z M6 6h1v1H6z M7 7h1v1H7z M9 7h1v1H9z M10 6h1v1h-1z M11 7h1v1h-1z',
              mouth: 'M6 10h5v1H6z M5 9h1v1H5z M11 9h1v1h-1z M7 11h3v1H7z' },
    // Ojos dentro del blanco (y 6-7) para que se lean en todos los tonos de piel.
    sad:    { eyes: 'M6 7h1v1H6z M10 7h1v1h-1z', mouth: 'M6 11h5v1H6z M5 10h1v1H5z M11 10h1v1h-1z',
              brow: 'M5 5h2v1H5z M10 5h2v1h-2z' },
    summon: { eyes: 'M6 6h1v2H6z M10 6h1v2h-1z', mouth: 'M7 10h2v2H7z' }   // boca abierta
  };

  var EXTRAS = {
    happy: '<path fill="var(--warn)" d="M1 6h1v1H1z M15 5h1v1h-1z M2 11h1v1H2z M14 10h1v1h-1z"/>',
    sad:   '<path fill="#7ee8fa" d="M13 7h1v2h-1z M13 9h1v1h-1z"/>'
  };

  /* Se dibuja DESPUES del cuerpo: el destello y la calculadora van delante
     de la mano alzada. La animacion es CSS (ver .avatar .flash / .calc). */
  var OVERLAYS = {
    summon:
      '<g class="flash">' +
        '<path fill="var(--warn)" d="M10 4h1v1h-1z M16 4h1v1h-1z M13 0h1v1h-1z M13 8h1v1h-1z"/>' +
      '</g>' +
      '<g class="calc">' +
        '<path fill="#0a0e24" d="M11 0h5v6h-5z"/>' +
        '<path fill="var(--accent)" d="M12 1h3v2h-3z"/>' +
        '<path fill="#eaf0ff" d="M12 4h1v1h-1z M14 4h1v1h-1z"/>' +
      '</g>'
  };

  function heroSVG(mood, hero) {
    hero = hero || HERO;
    var B = BODIES[(hero && hero.body) === 'b' ? 'b' : 'a'];
    var L = LIMBS[mood] || LIMBS.idle;
    var F = FACES[mood] || FACES.idle;

    return '<svg class="avatar" viewBox="0 0 17 20" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" aria-hidden="true">' +
      (EXTRAS[mood] || '') +
      // Pelo castano MEDIO, no casi negro: el #2b1a12 de v1 daba 1.03:1 contra
      // los cielos oscuros y el personaje se quedaba sin cabeza. Un sprite
      // tiene que leerse sobre cualquier fondo, no sobre uno.
      '<path fill="#8a5a30" d="' + B.hair + '"/>' +
      '<path fill="#3f2a18" d="' + B.hairdark + '"/>' +
      '<path fill="var(--h-skin)" d="M4 4h9v8H4z"/>' +
      // Blanco del ojo bajo los rasgos: sin el, unos ojos oscuros sobre piel
      // oscura dan 1.55:1 y la cara desaparece. En piel clara manda la pupila;
      // en piel oscura, este blanco. Con los dos, se lee en los 12 tonos.
      '<path fill="var(--h-eye)" d="M5 6h2v2H5z M10 6h2v2h-2z"/>' +
      (F.brow ? '<path fill="var(--h-ink)" d="' + F.brow + '"/>' : '') +
      '<path fill="var(--h-ink)" d="' + F.eyes + '"/>' +
      '<path fill="var(--h-mouth)" d="' + F.mouth + '"/>' +
      '<path fill="var(--h-helm)"  d="M3 5h1v3H3z M13 5h1v3h-1z M3 4h11v1H3z"/>' +
      '<path fill="var(--h-body)"  d="' + B.torso + ' ' + L.arms + '"/>' +
      '<path fill="var(--h-glove)" d="' + L.hands + '"/>' +
      // Sin emblema en el pecho: la cruz blanca se leia como un simbolo
      // (medico o religioso) que el juego no quiere decir. En su lugar, una
      // sombra en el lado derecho del torso: da volumen sin significar nada.
      '<path fill="rgba(0,0,0,.22)" d="' + B.shade + '"/>' +
      '<path fill="var(--h-boot)"  d="' + B.boots + '"/>' +
      (OVERLAYS[mood] || '') +

  }
  window.HeroSprite = heroSVG;
  window.SamuelSprite = heroSVG;   // alias historico

  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  /* ---------- SCENES: moverse ES responder ----------
     Contrato (PLAN-V2 §3.3):

       SCENES[mech]() -> {
         mount(container, ctx), move(delta), jump(i),
         confirm(), markResult(answerOrig, chosenOrig), destroy()
       }
       ctx = { variant, order, keys, pick(origIdx), say(text) }

     La escena SOLO pinta las opciones y traduce el movimiento en una
     eleccion. El Runner, la cola y `seen`/`lastVar`/`tries` no la conocen:
     por eso la garantia anti-repeticion no se puede romper desde aqui.

     `mech` es opcional por familia. Si falta, `doors`. Asi un data.js de v1
     (y cualquier materia futura que no quiera escena propia) sigue valiendo.
  ---------------------------------------------------- */
  var SCENES = {};

  SCENES.doors = function () {
    var corridor = null, startPad = null, heroEl = null;
    var slots = [];            // [{ node, orig }]
    var cursor = -1;           // -1 = casilla de inicio; 0..n-1 = puertas
    var ctx = null, dead = false, onResize = null, stacked = false;

    /* Una opcion puede ser "24" o "Each term is 10 more than the one before it."
       Cuatro frases en columnas estrechas son ilegibles, en movil y fuera de el.
       Por encima de este umbral el corredor se pone VERTICAL: cada puerta es una
       banda a lo ancho y el heroe baja por el carril izquierdo. Es el mismo
       modelo de movimiento (las flechas siguen valiendo), no una mecanica nueva. */
    var STACK_OVER = 12;
    function plain(s) { return String(s).replace(/<[^>]*>/g, ''); }

    function nodeAt(i) { return i < 0 ? startPad : slots[i].node; }

    /* Coloca al heroe bajo la casilla actual. Con prefers-reduced-motion la
       transicion CSS esta anulada, asi que aparece en vez de caminar (§0.4). */
    function place() {
      if (!heroEl || !corridor) return;
      var t = nodeAt(cursor);
      if (!t) return;
      if (stacked) {
        // Corredor vertical: el heroe baja por el carril izquierdo.
        heroEl.style.left = (startPad.offsetLeft + (startPad.offsetWidth / 2)) + 'px';
        heroEl.style.top  = (t.offsetTop + (t.offsetHeight / 2)) + 'px';
      } else {
        heroEl.style.left = (t.offsetLeft + (t.offsetWidth / 2)) + 'px';
        heroEl.style.top  = '';
      }
      slots.forEach(function (s, i) { s.node.classList.toggle('is-here', i === cursor); });
      if (startPad) startPad.classList.toggle('is-here', cursor === -1);
      // Parallax: el lugar sabe donde esta el heroe dentro del tramo (0..1).
      if (ctx && ctx.onStep) ctx.onStep(cursor < 0 ? 0 : (cursor + 1) / (slots.length + 1));
    }

    function announce() {
      if (!ctx) return;
      if (cursor < 0) { ctx.say(UI.scene.sayStart); return; }
      ctx.say(fmt(UI.scene.sayOn, {
        key: ctx.keys[cursor],
        value: slots[cursor].node.getAttribute('data-value')
      }));
    }

    return {
      mount: function (container, context) {
        ctx = context;
        dead = false;
        cursor = -1;

        var v = ctx.variant;
        stacked = ctx.order.some(function (o) { return plain(v.options[o]).length > STACK_OVER; });

        var html =
          '<div class="scene scene--doors' + (stacked ? ' scene--stacked' : '') + '">' +
            '<div class="scene__corridor">' +
              '<div class="scene__row">' +
                '<div class="scene__start" aria-hidden="true">' +
                  '<span class="scene__start-tag">' + UI.scene.startLabel + '</span>' +
                '</div>';
        ctx.order.forEach(function (orig, pos) {
          var label = String(v.options[orig]);
          html +=
            '<button type="button" class="door" data-orig="' + orig + '" data-value="' + esc(label.replace(/<[^>]*>/g, '')) + '" ' +
              'aria-label="' + esc(fmt(UI.scene.doorAria, { key: ctx.keys[pos], value: label.replace(/<[^>]*>/g, '') })) + '">' +
              '<span class="door__key">' + ctx.keys[pos] + '</span>' +
              '<span class="door__frame"><span class="door__value">' + label + '</span></span>' +
            '</button>';
        });
        html +=
              '</div>' +
              '<div class="scene__floor"></div>' +
              // El heroe cuelga del corredor, no del suelo: asi comparte
              // offsetParent con las puertas y basta un offsetLeft para situarlo.
              '<div class="scene__hero">' + heroSVG('idle') + '</div>' +
            '</div>' +
          '</div>';
        container.innerHTML = html;
        if (ctx.help) ctx.help(stacked ? UI.scene.helpStacked : UI.scene.help, stacked);

        corridor = container.querySelector('.scene__corridor');
        startPad = container.querySelector('.scene__start');
        heroEl   = container.querySelector('.scene__hero');
        slots = Array.prototype.map.call(container.querySelectorAll('.door'), function (n) {
          return { node: n, orig: parseInt(n.getAttribute('data-orig'), 10) };
        });

        var self = this;
        slots.forEach(function (s, i) {
          // Raton/touch: caminar hasta la puerta y cruzarla.
          s.node.addEventListener('click', function () { self.jump(i); });
          // Tab: el heroe sigue al foco para que vista y teclado no diverjan.
          s.node.addEventListener('focus', function () {
            if (dead) return;
            cursor = i; place();
          });
        });

        onResize = function () { place(); };
        window.addEventListener('resize', onResize);
        this.setMood('idle');
        place();
      },

      /* El heroe de la escena es el unico animado del juego: respira en reposo,
         celebra al acertar, se hunde al fallar e invoca la calculadora. */
      setMood: function (m) {
        if (!heroEl) return;
        heroEl.innerHTML = heroSVG(m || 'idle');
        var a = heroEl.querySelector('.avatar');
        if (!a) return;
        if (m === 'happy')       a.classList.add('avatar--cheer');
        else if (m === 'sad')    a.classList.add('avatar--down');
        else if (m === 'summon') a.classList.add('avatar--summon');
        else                     a.classList.add('avatar--bob');
      },

      move: function (delta) {
        if (dead) return;
        var next = Math.max(-1, Math.min(slots.length - 1, cursor + delta));
        if (next === cursor) return;
        cursor = next;
        place();
        if (cursor >= 0) slots[cursor].node.focus();
        announce();
      },

      /* Salta a una puerta y la cruza: es el atajo A-D / 1-4 de v1 y el
         camino del raton. Un nino que prefiera no caminar juega igual. */
      jump: function (i) {
        if (dead || i < 0 || i >= slots.length) return;
        cursor = i;
        place();
        this.confirm();
      },

      confirm: function () {
        if (dead) return null;
        if (cursor < 0) { ctx.say(UI.scene.sayNeedMove); return null; }
        dead = true;
        var orig = slots[cursor].orig;
        ctx.pick(orig);
        return orig;
      },

      markResult: function (answerOrig, chosenOrig) {
        slots.forEach(function (s) {
          s.node.disabled = true;
          if (s.orig === answerOrig) s.node.classList.add('is-right');
        });
        var correct = (answerOrig === chosenOrig);
        if (!correct) {
          slots.forEach(function (s) { if (s.orig === chosenOrig) s.node.classList.add('is-wrong', 'shake'); });
          // Playtest H2: el heroe SE QUEDA en la puerta roja. Volver al inicio se
          // leia como castigo (Tomas, el jugador mas fragil) y era puramente
          // cosmetico: la pregunta ya esta resuelta. La cara la pone setMate().
        }
        ctx.say(correct ? UI.scene.sayRight : UI.scene.sayWrong);
      },

      destroy: function () {
        dead = true;
        if (onResize) { window.removeEventListener('resize', onResize); onResize = null; }
        slots = []; corridor = startPad = heroEl = null; ctx = null;
      }
    };
  };

  /* El mensaje va al HUD; la REACCION va al heroe de la escena, que es el que
     el nino esta mirando porque es el que mueve. */
  function setMate(mood, msg, cls) {
    var m = el('mateMsg');
    if (m) { m.textContent = msg || ''; m.className = 'mate__msg' + (cls ? ' ' + cls : ''); }
    if (scene && scene.setMood) scene.setMood(mood);
  }

  /* ---------- ENV: el LUGAR detras de la escena ----------
     Hermano de SCENES, no parte de el: la escena pinta opciones y no sabe
     que lugar hay detras; ENV pinta el lugar y no sabe que mecanica hay
     encima. Un nivel declara `env` en data.js:

       env: { palette:{...}, materials:{wall,floor}, far:[...], wall:[...],
              fg:[...], gate:'gate', transition:'slide' }

     Los props vienen de assets/props.js (window.GAME_PROPS) por id. Aqui
     NO hay nombres de lugares: el lugar es la combinacion. Sin `env`, el
     nivel se ve como antes: cualquier data.js existente sigue valiendo.
  ---------------------------------------------------- */
  var ENV = (function () {
    var LIB   = window.GAME_PROPS || { props: {}, materials: {} };
    var host = null, node = null, gateEl = null, active = false;

    /* Comillas SIMPLES: este url() va dentro de un atributo style="..." con
       comillas dobles. Con dobles, el atributo se cortaba en `url(` y ningun
       material se pintaba. Lo encontro el harness. Las simples del SVG van
       codificadas como %27, asi que dentro no queda ninguna. */
    function uri(svg) {
      return "url('data:image/svg+xml," + encodeURIComponent(svg).replace(/'/g, '%27') + "')";
    }
    function propSVG(id, o, xOverride) {
      var p = LIB.props[id];
      if (!p) return '';
      var body = p.layers.map(function (L) {
        return '<path fill="' + L[0] + '"' + (L[2] ? ' class="' + L[2] + '"' : '') + ' d="' + L[1] + '"/>';
      }).join('');
      var sc = o.scale || 1;
      var x = xOverride != null ? xOverride : (o.x != null ? o.x : 50);
      var style = 'left:' + x + '%;width:' + Math.round(p.w * 3 * sc) + 'px;height:' + Math.round(p.h * 3 * sc) + 'px;' +
        (o.y === 'top' ? 'top:' + (o.top != null ? o.top : 4) + '%;' : 'bottom:' + (o.bottom != null ? o.bottom : 0) + '%;');
      return '<svg class="prop prop--' + id + '" viewBox="' + p.vb + '" shape-rendering="crispEdges" aria-hidden="true" style="' + style + '">' + body + '</svg>';
    }
    function layer(cls, items, style) {
      var out = '';
      (items || []).forEach(function (o) {
        if (o.repeat > 1) {
          // N copias repartidas a lo ancho (almenas, estalactitas).
          for (var i = 0; i < o.repeat; i++) out += propSVG(o.prop, o, Math.round((i + 0.5) * 100 / o.repeat));
        } else out += propSVG(o.prop, o);
      });
      // Los props van en un contenedor interior: es el que se desplaza (parallax);
      // el material queda en la capa y se desplaza por background-position.
      return '<div class="env__layer ' + cls + '"' + (style ? ' style="' + style + '"' : '') + '>' +
               '<div class="env__props">' + out + '</div></div>';
    }
    function material(which, id) {
      var m = LIB.materials[id];
      if (!m) return '';
      return 'background-image:linear-gradient(var(--env-' + which + '),var(--env-' + which + ')),' + uri(m.svg) +
             ';background-size:auto,' + (m.w * 2) + 'px ' + (m.h * 2) + 'px;';
    }

    return {
      mount: function (hostEl, env) {
        this.destroy();
        host = hostEl;
        if (!env || !host) { active = false; return; }
        active = true;
        var pal = env.palette || {};
        // Las variables van en el HOST, no en .env: las puertas de la escena
        // (hermana de .env) tambien las necesitan para vestirse del lugar.
        host.style.cssText = Object.keys(pal).map(function (k) { return '--env-' + k + ':' + pal[k]; }).join(';');
        var mats = env.materials || {};
        node = document.createElement('div');
        node.className = 'env';
        node.setAttribute('aria-hidden', 'true');
        node.innerHTML =
          '<div class="env__layer env__sky"></div>' +
          layer('env__far', env.far) +
          layer('env__wall', env.wall, material('wall', mats.wall)) +
          '<div class="env__layer env__floor" style="' + material('floor', mats.floor) + '"></div>' +
          layer('env__fg', env.fg);
        if (env.gate) {
          var far = node.querySelector('.env__far .env__props');
          // A escala 0.5 cabe en la franja de cielo aun cuando --gs llega a 1.
          far.insertAdjacentHTML('beforeend', propSVG(env.gate, { x: 90, scale: 0.5 }));
          gateEl = far.lastElementChild;
          gateEl.classList.add('env__gate');
        }
        host.insertBefore(node, host.firstChild);
        host.classList.add('has-env');
      },
      /* Desliza el lugar un tramo: la animacion es CSS por cambio de clase.
         Se re-dispara quitando y poniendo la clase. Sin temporizadores. */
      shift: function () {
        if (!node) return;
        node.classList.remove('is-shift');
        void node.offsetWidth;
        node.classList.add('is-shift');
      },
      /* 0..1: donde esta el heroe dentro del tramo. Las capas lejanas se
         mueven menos que las cercanas: profundidad con una sola variable. */
      parallax: function (f) {
        if (node) node.style.setProperty('--hx', String(Math.max(0, Math.min(1, f))));
      },
      /* 0..1: tramos superados. La puerta del jefe se acerca. */
      progress: function (f) {
        if (gateEl) gateEl.style.setProperty('--gs', String((0.45 + 0.55 * Math.max(0, Math.min(1, f))).toFixed(3)));
      },
      stacked: function (on) {
        if (host) host.classList.toggle('is-stacked', !!on);
      },
      isActive: function () { return active; },
      destroy: function () {
        if (node && node.parentNode) node.parentNode.removeChild(node);
        if (host) { host.classList.remove('has-env', 'is-stacked'); host.style.cssText = ''; }
        node = null; gateEl = null; active = false;
      }
    };
  })();

  /* ---------- QUESTION QUEUE ----------
     Regla anti-repeticion: cada pregunta es una FAMILIA con varias variantes.
     Una familia solo se supera al acertarla. Al fallar vuelve al final de la
     cola y se sirve OTRA variante, para que el nino razone de nuevo en vez de
     recordar que boton pulso.

     Garantias:
       1. Se agotan TODAS las variantes antes de reutilizar ninguna.
       2. Al reiniciar el ciclo nunca se repite la ultima servida, asi que es
          imposible ver la misma pregunta dos veces seguidas.
       3. `tries` cuenta los intentos reales de la familia (no se reinicia con
          el ciclo de variantes), asi que "acierto al primer intento" y las
          estrellas siguen siendo correctos por muchas vueltas que de.
  ------------------------------------------------------------- */
  function Runner(level) {
    this.level = level;
    this.queue = shuffle(level.questions.map(function (q, i) { return i; }));
    this.total = level.questions.length;
    this.cleared = 0;
    this.attempts = 0;
    this.firstTry = 0;
    this.misses = 0;
    this.combo = 0;
    this.bestCombo = 0;
    this.xp = 0;
    this.seen = {};      // familia -> [variantes ya servidas en este ciclo]
    this.tries = {};     // familia -> intentos reales acumulados
    this.lastVar = {};   // familia -> ultima variante servida
    this.answered = {};
    this.startedAt = Date.now();

    // Puntuacion v2: para el tope de estrellas y para las medallas.
    this.famFails = {};     // familia -> fallos en esta partida
    this.maxFamFails = 0;   // el peor atasco de la partida
    this.hitSkills = {};    // skill -> acertada alguna vez en ESTA partida
    this.firstSkills = {};  // skill -> acertada al primer intento en ESTA partida
  }
  Runner.prototype.current = function () {
    if (!this.queue.length) return null;
    var fi = this.queue[0];
    var fam = this.level.questions[fi];
    var used = this.seen[fi] || [];
    var last = this.lastVar[fi];
    var i, pool = [];

    for (i = 0; i < fam.variants.length; i++) if (used.indexOf(i) === -1) pool.push(i);

    if (!pool.length) {
      // Ciclo agotado: se reinicia, pero nunca con la variante recien vista.
      for (i = 0; i < fam.variants.length; i++) if (i !== last) pool.push(i);
      if (!pool.length) pool = [0];        // familia con una sola variante
      this.seen[fi] = [];
    }

    var vi = pool[Math.floor(Math.random() * pool.length)];
    (this.seen[fi] = this.seen[fi] || []).push(vi);
    this.lastVar[fi] = vi;
    this.tries[fi] = (this.tries[fi] || 0) + 1;
    return {
      familyIndex: fi, variantIndex: vi, family: fam, v: fam.variants[vi],
      tries: this.tries[fi],
      firstAttempt: this.tries[fi] === 1
    };
  };
  Runner.prototype.resolve = function (correct) {
    var fi = this.queue.shift();
    var skill = this.level.questions[fi].skill;
    this.attempts++;
    if (correct) {
      this.cleared++;
      this.combo++;
      if (this.combo > this.bestCombo) this.bestCombo = this.combo;
      var base = 100;
      var bonus = Math.min(this.combo, 8) * 20;
      this.xp += base + bonus;
      this.hitSkills[skill] = true;
      if (this.tries[fi] === 1) { this.firstTry++; this.firstSkills[skill] = true; }
      this.answered[fi] = true;
    } else {
      this.misses++;
      this.combo = 0;
      this.famFails[fi] = (this.famFails[fi] || 0) + 1;
      if (this.famFails[fi] > this.maxFamFails) this.maxFamFails = this.famFails[fi];
      this.queue.push(fi);   // al final de la cola, con otra variante
    }
  };
  Runner.prototype.progress = function () { return this.cleared / this.total; };
  /* Estrellas = aciertos al primer intento, con UN tope.

     El tope existe porque la media miente: con 16 familias, atascarse siete
     veces en una sola cuesta 1/16 y seguia dando 3 estrellas. El criterio del
     proyecto es explicito: "no domina = falla la misma familia 3 veces". Tres
     estrellas tienen que significar que domina el nivel entero, no 15/16 de el.
     Lo encontro el harness jugando, no leyendo el codigo. */
  Runner.prototype.STUCK_AT = 3;
  Runner.prototype.stars = function () {
    var acc = this.firstTry / this.total;
    var s = acc >= 0.9 ? 3 : acc >= 0.7 ? 2 : 1;
    if (this.stuck() && s > 2) s = 2;
    return s;
  };
  Runner.prototype.stuck = function () { return this.maxFamFails >= this.STUCK_AT; };
  Runner.prototype.minutes = function () { return Math.max(1, Math.round((Date.now() - this.startedAt) / 60000)); };

  /* Marca personal del nivel. Si la mejor partida sigue en el historial se
     anade cuantas acerto al primer intento; si es mas vieja que las ultimas 5,
     solo el XP. Nunca se inventa un dato que no se tiene. */
  function bestLine(ls, lv) {
    var bestRun = null;
    ls.history.forEach(function (h) { if (!bestRun || h.xp > bestRun.xp) bestRun = h; });
    if (bestRun && bestRun.xp === ls.best) {
      return fmt(UI.score.cardBestLine, { xp: ls.best, first: bestRun.first, total: lv.questions.length });
    }
    return fmt(UI.map.cardBest, { xp: ls.best }).replace(/^\s*&middot;\s*/, '');
  }

  /* ---------- HEROE Y ARMERIA ---------- */

  function renderHeroPick() {
