/* ============================================================
   SAMUEL QUEST — ENGINE.CSS
   Shared pixel-gaming design system.
   DO NOT fork this file per subject. Subjects only override
   --accent / --accent-2 via the [data-accent] attribute.
   ============================================================ */



/* ---------- 1. TOKENS ---------- */
:root {
  /* Base world palette — identical in every subject */
  --bg-0:      #0b0f2a;   /* deepest background          */
  --bg-1:      #131a3f;   /* panel background            */
  --bg-2:      #1c2555;   /* raised surface              */
  --bg-3:      #2a3573;   /* hover surface               */
  --ink:       #eaf0ff;   /* primary text                */
  --ink-dim:   #97a3d4;   /* secondary text              */
  --line:      #4658b8;   /* pixel border                */

  /* Semantic — identical in every subject */
  --good:      #3ce88a;
  --good-dark: #12683f;
  --bad:       #ff4d6d;
  --bad-dark:  #7a1930;
  --warn:      #ffd93d;
  --xp:        #7ee8fa;

  /* Subject accent — the ONLY thing a subject may change */
  --accent:    #7ee8fa;
  --accent-2:  #c77dff;

  /* Pixel geometry */
  --px:        4px;       /* one "pixel" unit            */
  --radius:    0px;       /* never round corners         */
  --font-ui:   'Press Start 2P', 'Courier New', monospace;
  --font-read: 'Nunito', 'Segoe UI', system-ui, sans-serif;
}

/* Per-subject accents. Add a new line when a new subject is added. */
[data-accent="maths"]     { --accent:#7ee8fa; --accent-2:#c77dff; }
[data-accent="science"]   { --accent:#3ce88a; --accent-2:#ffd93d; }
[data-accent="english"]   { --accent:#ff9e64; --accent-2:#ff4d6d; }
[data-accent="humanities"]{ --accent:#ffd93d; --accent-2:#ff9e64; }
[data-accent="spanish"]   { --accent:#ff6ec7; --accent-2:#7ee8fa; }
[data-accent="computing"] { --accent:#a0ff5c; --accent-2:#7ee8fa; }

/* ---------- 2. RESET / SHELL ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  background: var(--bg-0);
  background-image:
    radial-gradient(circle at 20% 0%,  rgba(126,232,250,.10), transparent 45%),
    radial-gradient(circle at 85% 15%, rgba(199,125,255,.10), transparent 45%),
    linear-gradient(180deg, #0b0f2a 0%, #070a1c 100%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-read);
  font-size: 17px;
  line-height: 1.6;
  min-height: 100vh;
  padding: 0 0 64px;
  overflow-x: hidden;
}

/* CRT scanlines — decorative, never blocks clicks */
body::after {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 9999;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,.13) 0px,
    rgba(0,0,0,.13) 1px,
    transparent 1px,
    transparent 3px
  );
  mix-blend-mode: multiply;
  opacity: .55;
}

.wrap { max-width: 860px; margin: 0 auto; padding: 0 18px; }

/* ---------- 3. PIXEL PRIMITIVES ---------- */

/* Chunky stepped border. Used on every box in the game. */
.pixel-box {
  background: var(--bg-1);
  border: var(--px) solid var(--line);
  box-shadow:
     0 0 0 var(--px) var(--bg-0),
     0 var(--px) 0 var(--px) rgba(0,0,0,.55);
  position: relative;
}

.pixel-box--raised { background: var(--bg-2); }

h1, h2, h3, .ui, .btn, .tag, .hud, .tile {
  font-family: var(--font-ui);
  letter-spacing: .5px;
  line-height: 1.5;
}

h1 { font-size: 20px; }
h2 { font-size: 15px; }
h3 { font-size: 12px; }

.text-accent { color: var(--accent); }
.text-dim    { color: var(--ink-dim); }

/* ---------- 4. BUTTONS ---------- */
.btn {
  display: inline-block;
  font-size: 11px;
  padding: 14px 18px;
  background: var(--bg-2);
  color: var(--ink);
  border: var(--px) solid var(--line);
  box-shadow: 0 var(--px) 0 0 #0a0e24, inset 0 var(--px) 0 0 rgba(255,255,255,.08);
  cursor: pointer;
  text-decoration: none;
  text-align: center;
  transition: transform .06s steps(2), background .12s;
  user-select: none;
}
.btn:hover   { background: var(--bg-3); }
.btn:active  { transform: translateY(var(--px)); box-shadow: 0 0 0 0 #0a0e24; }
.btn:focus-visible { outline: var(--px) solid var(--warn); outline-offset: var(--px); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }

.btn--primary {
  background: var(--accent);
  color: #071024;
  border-color: #fff;
  font-weight: 700;
}
.btn--primary:hover { background: #fff; }

.btn--ghost { background: transparent; }

/* ---------- 5. HUD ---------- */
.hud {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  margin: 18px 0;
  font-size: 10px;
}
.hud__group { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.hud__stat  { display: flex; gap: 7px; align-items: center; color: var(--ink-dim); }
.hud__stat b { color: var(--ink); font-weight: 400; }

.bar {
  height: 16px;
  background: #0a0e24;
  border: var(--px) solid var(--line);
  overflow: hidden;
  flex: 1;
  min-width: 140px;
}
.bar__fill {
  height: 100%;
  width: 0%;
  background: repeating-linear-gradient(90deg,
     var(--accent) 0 8px, color-mix(in srgb, var(--accent) 70%, #000) 8px 12px);
  transition: width .35s steps(10);
}

/* ---------- 6. AVATAR ---------- */
.avatar {
  width: 64px; height: 64px;
  image-rendering: pixelated;
  flex: none;
  filter: drop-shadow(0 4px 0 rgba(0,0,0,.6));
}
.avatar--sm { width: 40px; height: 40px; }
.avatar--lg { width: 96px; height: 96px; }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
.avatar--bob { animation: bob 1.4s steps(4) infinite; }

/* Reacciones a la respuesta */
@keyframes cheer {
  0%   { transform: translateY(0)     scale(1); }
  20%  { transform: translateY(-16px) scale(1.1); }
  40%  { transform: translateY(0)     scale(1); }
  60%  { transform: translateY(-10px) scale(1.06); }
  80%  { transform: translateY(0)     scale(1); }
  100% { transform: translateY(-4px)  scale(1.02); }
}
.avatar--cheer { animation: cheer .8s steps(8) forwards; }

@keyframes slump {
  0%   { transform: translateY(0)   rotate(0deg); }
  25%  { transform: translateY(3px) rotate(-7deg); }
  55%  { transform: translateY(6px) rotate(5deg); }
  100% { transform: translateY(7px) rotate(0deg); filter: grayscale(.5) drop-shadow(0 2px 0 rgba(0,0,0,.6)); }
}
.avatar--down { animation: slump .55s steps(5) forwards; }

@media (prefers-reduced-motion: reduce) {
  .avatar--bob, .avatar--cheer, .avatar--down { animation: none; }
  .shake, .pop { animation: none; }
}

/* Compañero en la pantalla de juego */
.mate {
  display: flex; align-items: center; gap: 12px;
  flex: none;
  min-width: 190px;
}
.mate__sprite { width: 56px; height: 56px; display: grid; place-items: center; flex: none; }
.mate__sprite .avatar { width: 56px; height: 56px; }
.mate__msg {
  font-family: var(--font-ui);
  font-size: 9px;
  line-height: 1.7;
  color: var(--ink-dim);
}
.mate__msg.is-good { color: var(--good); }
.mate__msg.is-bad  { color: var(--bad); }

/* ---------- 7. LEVEL MAP ---------- */
.levels { display: grid; gap: 16px; margin-top: 22px; }

.level-card {
  display: grid;
  grid-template-columns: 64px 1fr auto;
  gap: 16px;
  align-items: center;
  padding: 16px;
  cursor: pointer;
  transition: transform .08s steps(2);
}
.level-card:hover:not(.is-locked) { transform: translate(0, -3px); }
.level-card.is-locked { opacity: .45; cursor: not-allowed; }
.level-card.is-done   { border-color: var(--good); }

.level-card__num {
  font-family: var(--font-ui);
  font-size: 22px;
  width: 64px; height: 64px;
  display: grid; place-items: center;
  background: var(--bg-0);
  border: var(--px) solid var(--accent);
  color: var(--accent);
}
.level-card.is-done .level-card__num { border-color: var(--good); color: var(--good); }
.level-card__name { font-family: var(--font-ui); font-size: 12px; margin-bottom: 8px; }
.level-card__sub  { color: var(--ink-dim); font-size: 14px; }
.stars { font-family: var(--font-ui); font-size: 16px; color: var(--warn); white-space: nowrap; }
.stars .off { color: #333c72; }

/* ---------- 8. QUESTION SCREEN ---------- */
.stage { margin-top: 20px; padding: 22px; }

.q-tag {
  display: inline-block;
  font-family: var(--font-ui);
  font-size: 9px;
  padding: 6px 9px;
  background: var(--bg-0);
  border: 2px solid var(--accent);
  color: var(--accent);
  margin-bottom: 16px;
}

.q-stem { font-size: 19px; font-weight: 700; line-height: 1.55; margin-bottom: 8px; }
.q-sub  { color: var(--ink-dim); font-size: 15px; margin-bottom: 18px; }

/* Sequence tiles */
.seq {
  display: flex; flex-wrap: wrap; gap: 10px;
  margin: 18px 0 22px;
}
.tile {
  min-width: 62px;
  padding: 12px 10px;
  text-align: center;
  font-size: 13px;
  background: var(--bg-0);
  border: var(--px) solid var(--line);
  color: var(--ink);
}
.tile--blank { border-color: var(--warn); color: var(--warn); background: #1a1533; }
.tile--ghost { opacity: .45; }

/* Options */
.options { display: grid; gap: 12px; grid-template-columns: repeat(2, 1fr); }
@media (max-width: 620px) { .options { grid-template-columns: 1fr; } }

.opt {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 14px;
  background: var(--bg-2);
  border: var(--px) solid var(--line);
  box-shadow: 0 var(--px) 0 0 #0a0e24;
  cursor: pointer;
  font-size: 18px;
  font-weight: 700;
  text-align: left;
  color: var(--ink);
  font-family: var(--font-read);
  transition: background .12s, transform .06s steps(2);
}
.opt:hover:not(:disabled) { background: var(--bg-3); }
.opt:active:not(:disabled){ transform: translateY(var(--px)); box-shadow: none; }
.opt:focus-visible { outline: var(--px) solid var(--warn); outline-offset: var(--px); }
.opt__key {
  font-family: var(--font-ui);
  font-size: 11px;
  width: 30px; height: 30px;
  flex: none;
  display: grid; place-items: center;
  background: var(--bg-0);
  border: 2px solid var(--line);
  color: var(--accent);
}
.opt.is-right { background: var(--good-dark); border-color: var(--good); }
.opt.is-right .opt__key { border-color: var(--good); color: var(--good); }
.opt.is-wrong { background: var(--bad-dark); border-color: var(--bad); }
.opt.is-wrong .opt__key { border-color: var(--bad); color: var(--bad); }
.opt:disabled { cursor: default; }

@keyframes shake {
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)}
  40%{transform:translateX(7px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
}
.shake { animation: shake .3s steps(3); }

@keyframes pop { 0%{transform:scale(.9)} 60%{transform:scale(1.04)} 100%{transform:scale(1)} }
.pop { animation: pop .22s steps(3); }

/* Feedback panel */
.feedback { margin-top: 18px; padding: 16px; display: none; }
.feedback.is-on { display: block; }
.feedback__title { font-family: var(--font-ui); font-size: 12px; margin-bottom: 10px; }
.feedback--good { border-color: var(--good); }
.feedback--good .feedback__title { color: var(--good); }
.feedback--bad  { border-color: var(--bad); }
.feedback--bad  .feedback__title { color: var(--bad); }
.feedback__body { font-size: 16px; }
.feedback__body code {
  font-family: var(--font-ui); font-size: 12px;
  background: var(--bg-0); padding: 2px 5px; border: 2px solid var(--line);
}

/* Hint */
.hint {
  margin-top: 14px; padding: 12px 14px;
  border-left: var(--px) solid var(--warn);
  background: rgba(255,217,61,.08);
  font-size: 15px;
  display: none;
}
.hint.is-on { display: block; }

/* Briefing (mini-lesson) */
.brief { padding: 22px; margin-top: 20px; }
.brief h2 { color: var(--accent); margin-bottom: 16px; }
.brief p  { margin-bottom: 14px; font-size: 17px; }
.brief ul { margin: 0 0 14px 20px; }
.brief li { margin-bottom: 8px; }
.brief .example {
  background: var(--bg-0);
  border: var(--px) solid var(--line);
  padding: 14px; margin: 14px 0;
  font-family: var(--font-ui); font-size: 12px; line-height: 1.9;
  overflow-x: auto;
}

/* Combo popup */
.combo {
  position: fixed; right: 20px; top: 20px; z-index: 50;
  font-family: var(--font-ui); font-size: 14px;
  color: var(--warn); text-shadow: 0 3px 0 #000;
  opacity: 0; pointer-events: none;
}
@keyframes floatUp { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-40px)} }
.combo.is-on { animation: floatUp .8s steps(8) forwards; }

/* Victory screen */
.victory { text-align: center; padding: 34px 22px; }
.victory h2 { color: var(--warn); font-size: 18px; margin-bottom: 18px; }
.victory .stars { font-size: 34px; margin: 18px 0; }
.victory__stats { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; margin: 22px 0; font-family: var(--font-ui); font-size: 11px; }
.victory__stats div span { display: block; color: var(--ink-dim); font-size: 9px; margin-bottom: 8px; }

/* Row helpers */
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.row--end { justify-content: flex-end; }
.mt   { margin-top: 18px; }
.mt-lg{ margin-top: 30px; }

.screen { display: none; }
.screen.is-on { display: block; }

/* Site header */
.site-head { padding: 26px 0 6px; display: flex; gap: 18px; align-items: center; }
.site-head h1 { line-height: 1.4; }
.site-head p { color: var(--ink-dim); font-size: 14px; margin-top: 8px; }

footer { text-align: center; color: var(--ink-dim); font-size: 12px; margin-top: 40px; }

@media (max-width: 620px) {
  body { font-size: 16px; }
  h1 { font-size: 15px; }
  .stage { padding: 16px; }
  .level-card { grid-template-columns: 52px 1fr; }
  .level-card__num { width: 52px; height: 52px; font-size: 18px; }
  .stars { grid-column: 1 / -1; }
}

</style>

<script>
/* ============================================================
   SAMUEL QUEST — ENGINE.JS
   Subject-agnostic game engine. Reads window.QUIZ_DATA.
   Never edit this file to add a subject; only add a data file.
   ============================================================ */
(function () {
  'use strict';

  var DATA = window.QUIZ_DATA;
  if (!DATA) { document.body.innerHTML = '<p style="padding:40px">Missing QUIZ_DATA.</p>'; return; }

  var SAVE_KEY = 'samuel-quest:' + DATA.meta.slug;
  var KEYS = ['A', 'B', 'C', 'D', 'E'];

  /* ---------- SAVE STATE ---------- */
  function blankSave() {
    return { levels: {}, totalXP: 0, sound: true, music: true, version: 2 };
  }
  function load() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return blankSave();
      var s = JSON.parse(raw);
      if (!s || typeof s !== 'object' || !s.levels) return blankSave();
      if (typeof s.music !== 'boolean') s.music = true;   // saves anteriores
      if (typeof s.sound !== 'boolean') s.sound = true;
      return s;
    } catch (e) { return blankSave(); }
  }
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(STATE)); } catch (e) { /* private mode */ }
  }
  var STATE = load();

  /* ---------- AUDIO (no assets, pure WebAudio) ---------- */
  var actx = null;
  function beep(freq, dur, type, vol) {
    if (!STATE.sound) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, actx.currentTime);
      g.gain.setValueAtTime(vol == null ? 0.06 : vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) { /* audio unavailable */ }
  }
  var SFX = {
    right:  function () { beep(660, .08); setTimeout(function () { beep(990, .12); }, 80); },
    wrong:  function () { beep(200, .18, 'sawtooth', .05); },
    click:  function () { beep(440, .04, 'square', .03); },
    level:  function () { [523, 659, 784, 1047].forEach(function (f, i) { setTimeout(function () { beep(f, .16); }, i * 110); }); },
    unlock: function () { [392, 523, 659].forEach(function (f, i) { setTimeout(function () { beep(f, .12); }, i * 90); }); }
  };

  /* ---------- MUSICA CHIPTUNE ----------
     Secuenciador de 8 compases generado con osciladores. Cero archivos,
     cero peso, cero licencias. Lead cuadrada + bajo triangular + bateria.
     Progresion I-V-vi-IV en Do mayor, 126 BPM.
  --------------------------------------- */
  var MUSIC = (function () {
    var mctx = null, bus = null, noise = null;
    var timer = null, step = 0, nextT = 0, on = false;
    var BPM = 126, EIGHTH = 30 / BPM;   // segundos por corchea

    // 0 = silencio. Notas MIDI.
    var LEAD_A = [
      64,67,72,67, 64,67,72,74,      // C
      74,71,67,71, 74,71,67,69,      // G
      72,69,64,69, 72,69,64,65,      // Am
      69,65,60,65, 69,72,67, 0       // F
    ];
    var LEAD_B = [
      72,76,79,76, 72,76,79,81,      // C (octava alta)
      79,74,71,74, 79,74,71,72,      // G
      76,72,69,72, 76,81,79,76,      // Am
      72,69,65,69, 72,76,72, 0       // F
    ];

    var BASS  = [48,0,55,0, 48,0,55,0,  43,0,50,0, 43,0,50,0,
                 45,0,52,0, 45,0,52,0,  41,0,48,0, 41,0,48,0];
    var KICK  = [1,0,0,0, 1,0,0,0];      // por compas
    var HAT   = [0,1,0,1, 0,1,0,1];

    function f(m) { return 440 * Math.pow(2, (m - 69) / 12); }

    function noiseBuf() {
      if (noise) return noise;
      var len = Math.floor(mctx.sampleRate * 0.2);
      noise = mctx.createBuffer(1, len, mctx.sampleRate);
      var d = noise.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      return noise;
    }

    function tone(freq, t, dur, type, vol) {
      var o = mctx.createOscillator(), g = mctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t + dur + 0.02);
    }

    function kick(t) {
      var o = mctx.createOscillator(), g = mctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(130, t);
      o.frequency.exponentialRampToValueAtTime(45, t + 0.11);
      g.gain.setValueAtTime(0.16, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t + 0.18);
    }

    function hat(t) {
      var s = mctx.createBufferSource(), g = mctx.createGain(), hp = mctx.createBiquadFilter();
      s.buffer = noiseBuf();
      hp.type = 'highpass'; hp.frequency.value = 7000;
      g.gain.setValueAtTime(0.035, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
      s.connect(hp); hp.connect(g); g.connect(bus);
      s.start(t); s.stop(t + 0.05);
    }

    function playStep(i, t) {
      var n = i % 32;                       // 32 corcheas = 4 compases
      var loop = Math.floor(i / 32) % 2;    // alterna frase A / B
      var lead = (loop === 0 ? LEAD_A : LEAD_B)[n];
      if (lead) tone(f(lead), t, EIGHTH * 0.85, 'square', 0.045);
      if (BASS[n]) tone(f(BASS[n]), t, EIGHTH * 1.6, 'triangle', 0.075);
      var b = n % 8;
      if (KICK[b]) kick(t);
      if (HAT[b])  hat(t);
    }

    function scheduler() {
      if (!on || !mctx) return;
      while (nextT < mctx.currentTime + 0.2) {
        playStep(step, nextT);
        nextT += EIGHTH;
        step++;
      }
    }

    var LEVEL = 0.5;
    function setGain(v, tau) {
      if (bus && mctx) bus.gain.setTargetAtTime(v, mctx.currentTime, tau || 0.06);
    }

    var api = {
      start: function () {
        if (on) return;
        try {
          if (!mctx) {
            mctx = new (window.AudioContext || window.webkitAudioContext)();
            bus = mctx.createGain();
            bus.gain.value = LEVEL;
            bus.connect(mctx.destination);
          }
          if (mctx.state === 'suspended') mctx.resume();
          on = true;
          setGain(LEVEL);
          nextT = mctx.currentTime + 0.08;
          scheduler();
          timer = setInterval(scheduler, 45);
        } catch (e) { on = false; }
      },
      stop: function () {
        on = false;
        if (timer) { clearInterval(timer); timer = null; }
        setGain(0, 0.04);
      },
      // Baja el volumen un momento para que se oiga un efecto de sonido.
      duck: function (ms) {
        if (!on) return;
        setGain(0.12, 0.04);
        setTimeout(function () { if (on) setGain(LEVEL, 0.08); }, ms || 1500);
      },
      isOn: function () { return on; }
    };
    return api;
  })();

  /* ---------- UTIL ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function el(id) { return document.getElementById(id); }

  function levelSave(id) {
    if (!STATE.levels[id]) STATE.levels[id] = { done: false, stars: 0, best: 0, plays: 0 };
    return STATE.levels[id];
  }
  function isUnlocked(idx) {
    if (idx === 0) return true;
    var prev = DATA.levels[idx - 1];
    return !!levelSave(prev.id).done;
  }

  /* ---------- SPRITE (inline pixel-art Samuel) ----------
     Moods: 'idle' | 'happy' (celebra) | 'sad' (derrotado)
     Cada mood cambia ojos, boca y BRAZOS. Nada de archivos de imagen.
  -------------------------------------------------------- */
  function samuelSVG(mood) {

    } else if (mood === 'sad') {

      // piernas
      '<path fill="#1c2555" d="M5 18h3v2H5z M9 18h3v2H9z"/>' +
      '</svg>';
  }
  window.SamuelSprite = samuelSVG;

  var CHEERS = ['NICE ONE!', 'GOT IT!', 'YES!', 'SHARP!', 'CLEAN WORK!', 'THAT\'S IT!'];
  var CONSOLES = ['NOT YET...', 'ALMOST!', 'TRY AGAIN', 'KEEP GOING', 'SHAKE IT OFF'];

  /* ---------- QUESTION QUEUE ----------
     Anti-repeat rule: every question is a FAMILY with >=2 variants.
     A family is only cleared when answered correctly. On a miss the
     family goes to the back of the queue and serves a DIFFERENT
     variant, so Samuel has to reason again, not recall an answer.
  ------------------------------------------------------------- */
  function Runner(level) {
    this.level = level;
    this.queue = shuffle(level.questions.map(function (q, i) { return i; }));
    this.total = level.questions.length;
    this.cleared = 0;
    this.attempts = 0;
    this.firstTry = 0;
    this.misses = 0;
    this.combo = 0;
    this.bestCombo = 0;
    this.xp = 0;
    this.seen = {};      // familyIndex -> [variantIndex,...]
    this.answered = {};  // familyIndex -> true once cleared
    this.startedAt = Date.now();
  }
  Runner.prototype.current = function () {
    if (!this.queue.length) return null;
    var fi = this.queue[0];
    var fam = this.level.questions[fi];
    var used = this.seen[fi] || [];
    var pool = [];
    for (var i = 0; i < fam.variants.length; i++) if (used.indexOf(i) === -1) pool.push(i);
    if (!pool.length) { pool = []; for (var j = 0; j < fam.variants.length; j++) pool.push(j); this.seen[fi] = []; used = []; }
    var vi = pool[Math.floor(Math.random() * pool.length)];
    (this.seen[fi] = this.seen[fi] || []).push(vi);
    return { familyIndex: fi, variantIndex: vi, family: fam, v: fam.variants[vi], firstAttempt: used.length === 0 };
  };
  Runner.prototype.resolve = function (correct) {
    var fi = this.queue.shift();
    this.attempts++;
    if (correct) {
      this.cleared++;
      this.combo++;
      if (this.combo > this.bestCombo) this.bestCombo = this.combo;
      var base = 100;
      var bonus = Math.min(this.combo, 8) * 20;
      this.xp += base + bonus;
      if ((this.seen[fi] || []).length === 1) this.firstTry++;
      this.answered[fi] = true;
    } else {
      this.misses++;
      this.combo = 0;
      this.queue.push(fi);   // back of the line, different variant next time
    }
  };
  Runner.prototype.progress = function () { return this.cleared / this.total; };
  Runner.prototype.stars = function () {
    var acc = this.firstTry / this.total;
    if (acc >= 0.9) return 3;
    if (acc >= 0.7) return 2;
    return 1;
  };
  Runner.prototype.minutes = function () { return Math.max(1, Math.round((Date.now() - this.startedAt) / 60000)); };

      var unlocked = isUnlocked(idx);
      var card = document.createElement('div');
      card.className = 'pixel-box level-card' + (unlocked ? '' : ' is-locked') + (ls.done ? ' is-done' : '');
      card.innerHTML =
        '<div class="level-card__num">' + (unlocked ? lv.id : '&#128274;') + '</div>' +
        '<div>' +
          '<div class="level-card__name">' + esc(lv.name) + '</div>' +
          '<div class="level-card__sub">' + esc(lv.subtitle) + '</div>' +
          '<div class="level-card__sub text-dim" style="margin-top:6px;font-size:13px">Day ' + lv.id +
            ' &middot; ' + lv.questions.length + ' challenges' +
            (ls.done ? ' &middot; best ' + ls.best + ' XP' : '') + '</div>' +
        '</div>' +
        '<div class="stars">' + starStr(ls.stars) + '</div>';
      if (unlocked) {
        card.setAttribute('tabindex', '0');
        card.setAttribute('role', 'button');
        var open = function () { SFX.click(); openBrief(idx); };
        card.addEventListener('click', open);
        card.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
      }
      list.appendChild(card);
    });
    el('mapXP').textContent = STATE.totalXP;
    el('mapDone').textContent = done + '/' + DATA.levels.length;
    el('btnSound').textContent = 'SOUND: ' + (STATE.sound ? 'ON' : 'OFF');
    el('btnMusic').textContent = 'MUSIC: ' + (STATE.music ? 'ON' : 'OFF');
    el('allDone').innerHTML = (done === DATA.levels.length)
      ? '<div class="pixel-box victory mt-lg"><h2>&#127942; ALL LEVELS CLEARED</h2>' +
        '<p>You are ready for the ' + esc(DATA.meta.test) + '. Replay any level to push for 3 stars.</p></div>'
      : '';
  }

  /* ---------- BRIEFING ---------- */
  var currentIdx = 0, run = null;

  function openBrief(idx) {
    currentIdx = idx;
    var lv = DATA.levels[idx];
    el('briefBody').innerHTML =
      '<div class="q-tag">DAY ' + lv.id + ' &middot; BRIEFING</div>' +
      '<h2>' + esc(lv.name) + '</h2>' +
      lv.briefing.join('');
    show('brief');
  }

  el('briefBack').addEventListener('click', function () { SFX.click(); renderMap(); show('map'); });
  el('briefGo').addEventListener('click', function () { SFX.click(); startLevel(currentIdx); });

  /* ---------- PLAY ---------- */
  var q = null, locked = false;

  function startLevel(idx) {
    var lv = DATA.levels[idx];
    run = new Runner(lv);
    el('hudLvl').textContent = 'LV ' + lv.id;
    setMate('idle', 'LET\'S GO');
    if (STATE.music) MUSIC.start();
    show('play');
    nextQuestion();
  }

  function nextQuestion() {
    if (!run.queue.length) return winLevel();
    q = run.current();
    locked = false;

    el('qTag').textContent = q.family.skill.toUpperCase().replace(/-/g, ' ');
    el('qStem').innerHTML = q.v.stem;
    el('qSub').innerHTML = q.v.sub || '';
    el('qSub').style.display = q.v.sub ? 'block' : 'none';

    // sequence tiles
    var seqBox = el('qSeq');
    if (q.v.seq && q.v.seq.length) {
      seqBox.style.display = 'flex';
      seqBox.innerHTML = q.v.seq.map(function (t) {
        var blank = (t === '?' || t === '' || t === null);
        return '<div class="tile' + (blank ? ' tile--blank' : '') + '">' + esc(blank ? '?' : t) + '</div>';
      }).join('');
    } else { seqBox.style.display = 'none'; seqBox.innerHTML = ''; }

    // options — shuffled every single time
    var order = shuffle(q.v.options.map(function (_, i) { return i; }));
    var box = el('qOpts');
    box.innerHTML = '';
    order.forEach(function (origIdx, pos) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      b.setAttribute('data-orig', String(origIdx));
      b.innerHTML = '<span class="opt__key">' + KEYS[pos] + '</span><span>' + q.v.options[origIdx] + '</span>';
      b.addEventListener('click', function () { answer(origIdx, b); });
      box.appendChild(b);
    });

    el('qHint').className = 'hint';
    el('qHint').innerHTML = '<b>Hint:</b> ' + (q.v.hint || 'Look at the size of each jump.');
    el('btnHint').style.display = 'inline-block';
    el('qFeed').className = 'pixel-box feedback';
    el('btnNext').style.display = 'none';
    setMate('idle', run.combo >= 3 ? 'COMBO x' + run.combo : 'YOUR TURN');
    updateHUD();
  }

  function updateHUD() {
    el('hudBar').style.width = Math.round(run.progress() * 100) + '%';
    el('hudCount').textContent = run.cleared + '/' + run.total;
    el('hudXP').textContent = run.xp;
    el('hudCombo').textContent = run.combo;
  }

  function popCombo(text) {
    var p = el('comboPop');
    p.textContent = text;
    p.className = 'combo';
    void p.offsetWidth;
    p.className = 'combo is-on';
  }

  function answer(chosen, btn) {
    if (locked) return;
    locked = true;
    var correct = (chosen === q.v.answer);
    var buttons = el('qOpts').querySelectorAll('.opt');

    Array.prototype.forEach.call(buttons, function (b) {
      b.disabled = true;
      if (parseInt(b.getAttribute('data-orig'), 10) === q.v.answer) b.classList.add('is-right');
    });
    if (!correct) { btn.classList.add('is-wrong', 'shake'); }
    else { btn.classList.add('pop'); }

    var fb = el('qFeed');
    if (correct) {
      SFX.right();
      MUSIC.duck(900);
      run.resolve(true);
      setMate('happy', run.combo >= 3 ? 'COMBO x' + run.combo + '!' : pick(CHEERS), 'is-good');
      if (run.combo >= 3) popCombo('COMBO x' + run.combo + '!');
      fb.className = 'pixel-box feedback is-on feedback--good';
      fb.innerHTML = '<div class="feedback__title">&#10003; CORRECT</div><div class="feedback__body">' + q.v.explain + '</div>';
    } else {
      SFX.wrong();
      MUSIC.duck(900);
      run.resolve(false);
      setMate('sad', pick(CONSOLES), 'is-bad');
      fb.className = 'pixel-box feedback is-on feedback--bad';
      fb.innerHTML = '<div class="feedback__title">&#10007; NOT YET</div><div class="feedback__body">' + q.v.explain +
        '<p style="margin-top:12px;color:var(--warn)"><b>This challenge comes back later with different numbers</b> &mdash; so work out the method, not the answer.</p></div>';
    }
    el('btnHint').style.display = 'none';
    el('btnNext').style.display = 'inline-block';
    el('btnNext').textContent = run.queue.length ? 'NEXT >' : 'FINISH LEVEL >';
    el('btnNext').focus();
    updateHUD();
  }

  el('btnNext').addEventListener('click', function () { SFX.click(); nextQuestion(); });
  el('btnHint').addEventListener('click', function () { SFX.click(); el('qHint').classList.add('is-on'); });
  el('btnQuit').addEventListener('click', function () {
    if (confirm('Leave this level? Progress in this level is not saved.')) { renderMap(); show('map'); }
  });

  // keyboard: A/B/C/D or 1-4
  document.addEventListener('keydown', function (e) {
    if (!screens.play.classList.contains('is-on')) return;
    if (e.key === 'Enter' && el('btnNext').style.display !== 'none') { el('btnNext').click(); return; }
    var k = e.key.toUpperCase();
    var idx = KEYS.indexOf(k);
    if (idx === -1 && /^[1-5]$/.test(k)) idx = parseInt(k, 10) - 1;
    if (idx === -1) return;
    var btns = el('qOpts').querySelectorAll('.opt');
    if (btns[idx] && !btns[idx].disabled) btns[idx].click();
  });

  /* ---------- WIN ---------- */
  function winLevel() {
    var lv = DATA.levels[currentIdx];
    var ls = levelSave(lv.id);
    var stars = run.stars();
    var wasNew = !ls.done;

    ls.done = true;
    ls.plays++;
    if (stars > ls.stars) ls.stars = stars;
    if (run.xp > ls.best) { STATE.totalXP += (run.xp - ls.best); ls.best = run.xp; }
    save();

    SFX.level();
    MUSIC.duck(2600);
    var nextLv = DATA.levels[currentIdx + 1];
    el('winBody').innerHTML =
      '<div style="display:flex;justify-content:center">' + samuelSVG('happy').replace('class="avatar"', 'class="avatar avatar--lg avatar--bob"') + '</div>' +
      '<h2>LEVEL ' + lv.id + ' CLEARED</h2>' +
      '<div class="stars">' + starStr(stars) + '</div>' +
      '<div class="victory__stats">' +
        '<div><span>XP</span>' + run.xp + '</div>' +
        '<div><span>FIRST TRY</span>' + run.firstTry + '/' + run.total + '</div>' +
        '<div><span>BEST COMBO</span>' + run.bestCombo + '</div>' +
        '<div><span>MISSES</span>' + run.misses + '</div>' +
      '</div>' +
      '<p class="text-dim" style="font-size:15px">' +
        (stars === 3 ? 'Perfect run. You have this topic locked in.'
         : stars === 2 ? 'Strong. Replay to hunt the third star.'
         : 'Cleared it. Replay this level tomorrow &mdash; the questions come back with new numbers.') +
      '</p>' +
      (nextLv && wasNew ? '<p class="mt" style="color:var(--good);font-family:var(--font-ui);font-size:11px">&#128275; UNLOCKED: LEVEL ' + nextLv.id + ' &mdash; ' + esc(nextLv.name) + '</p>' : '') +
      '<div class="row mt-lg" style="justify-content:center">' +
        '<button class="btn btn--ghost" id="winReplay" type="button">REPLAY</button>' +
        '<button class="btn btn--primary" id="winMap" type="button">' + (nextLv ? 'BACK TO MAP >' : 'BACK TO MAP >') + '</button>' +
      '</div>';

    if (nextLv && wasNew) setTimeout(SFX.unlock, 700);

    el('winReplay').addEventListener('click', function () { SFX.click(); startLevel(currentIdx); });
    el('winMap').addEventListener('click', function () { SFX.click(); renderMap(); show('map'); });
    show('win');
  }

  /* ---------- MAP CONTROLS ---------- */
  el('btnSound').addEventListener('click', function () {
    STATE.sound = !STATE.sound; save(); SFX.click();
    el('btnSound').textContent = 'SOUND: ' + (STATE.sound ? 'ON' : 'OFF');
  });

  function toggleMusic() {
    STATE.music = !STATE.music;
    save();
    if (STATE.music) MUSIC.start(); else MUSIC.stop();
    el('btnMusic').textContent = 'MUSIC: ' + (STATE.music ? 'ON' : 'OFF');
    el('btnMusic2').textContent = 'MUSIC: ' + (STATE.music ? 'ON' : 'OFF');
  }
  el('btnMusic').addEventListener('click', toggleMusic);
  el('btnMusic2').addEventListener('click', toggleMusic);
  el('btnMusic2').textContent = 'MUSIC: ' + (STATE.music ? 'ON' : 'OFF');

  // Los navegadores solo permiten audio tras una interaccion del usuario.
  document.addEventListener('click', function once() {
    document.removeEventListener('click', once);
    if (STATE.music) MUSIC.start();
  });

  // Silencia si Samuel cambia de pestana.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) MUSIC.stop();
    else if (STATE.music) MUSIC.start();
  });
  el('btnReset').addEventListener('click', function () {
    if (confirm('Reset all progress for ' + DATA.meta.topic + '?')) {
      STATE = blankSave(); save(); renderMap();
    }
  });

  renderMap();
})();

</script>
</body>
</html>
